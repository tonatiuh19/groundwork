  /api/public/contact:
    post:
      summary: Public contact form (SMS consent fields)
      description: |
        Most intents create a lead. intent=partner creates a pending affiliate (no lead),
        same as /api/public/partner-referral, and accepts optional referral_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - phone
                - intent
                - sms_transactional_consent
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                intent:
                  type: string
                  enum: [adu_project, financing, partner, general]
                preferred_language:
                  type: string
                  enum: [en, es]
                sms_transactional_consent:
                  type: boolean
                sms_marketing_consent:
                  type: boolean
                referral_code:
                  type: string
                  nullable: true
      responses:
        "201":
          description: |
            Lead stored (most intents) or pending affiliate when intent=partner.
            Confirmation + staff notify (dry-run under Vitest).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, lead_id, message]
                    properties:
                      ok: { type: boolean }
                      lead_id: { type: integer }
                      message: { type: string }
                  - type: object
                    required: [ok, affiliate_id, kind, message]
                    properties:
                      ok: { type: boolean }
                      affiliate_id: { type: integer }
                      kind: { type: string, enum: [partner_affiliate] }
                      message: { type: string }
        "400":
          description: Validation error
        "409":
          description: errors.affiliateExists / errors.emailExists* (intent=partner)
        "429":
          description: Rate limited
  /api/public/partner-referral:
    post:
      description: "Also partner_type / license_number (Realtor DRE #, Lender NMLS #), same rules as affiliate signup."
      summary: Partner / referral program signup (creates pending affiliate, not a lead)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, phone]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                preferred_language:
                  type: string
                  enum: [en, es]
                referral_code:
                  type: string
                  nullable: true
                  description: From /r/:code or ?ref= — sets parent_affiliate_id when active
      responses:
        "201":
          description: Pending affiliate created; confirmation + staff notify (partner_referral event key)
          content:
            application/json:
              schema:
                type: object
                required: [ok, affiliate_id, message]
                properties:
                  ok: { type: boolean }
                  affiliate_id: { type: integer }
                  message: { type: string }
        "400":
          description: Validation error
        "409":
          description: errors.affiliateExists / errors.emailExistsClient / errors.emailExistsContractor
        "429":
          description: Rate limited
  /api/public/plans:
    get:
      summary: "List active ADU plans"
      tags: [portal-public]
      responses:
        "200": { description: "Plans (id, code, name, bedrooms, bathrooms, stories, sq_ft, images)" }
  /api/public/affiliate/signup:
    post:
      description: "partner_type realtor | lender | other; realtor needs company + license_number (DRE #), lender needs company + license_number (NMLS #). Approved lenders join the Lenders directory (lenders.affiliate_id, nmls_number). Body { first_name, last_name, email, phone, company?, preferred_language?, sponsor_code? }. sponsor_code = the referral code of the affiliate whose link they came from (\"I\x27m a realtor / partner\" on /r/:code): they join that affiliate\x27s team as Sponsor, and the sponsor gets an email. Unknown / inactive sponsor_code → 400 errors.referralInactive."
      summary: "Affiliate self-signup (account starts pending admin approval)"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201": { description: "Application stored; staff notified (live when RESEND_API_KEY is set; dry-run under Vitest)" }
        "400": { description: "Validation error (i18n key in error)" }
        "409": { description: "errors.affiliateExists" }
        "429": { description: "Rate limited" }
  /api/public/client/signup:
    post:
      summary: "Homeowner portal self-signup (pending until staff approves → prospect + portal invite)"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                address_line1: { type: string, nullable: true }
                city: { type: string, nullable: true }
                city_id: { type: integer, nullable: true, description: "Picked city (service_cities). Wins over the typed city and fills it with the city name; a typed city alone is tagged only on an exact name match. Unknown or archived id → 400 validation.invalidField." }
                zip: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201":
          description: "{ ok, outcome: created } — applicant + staff notified"
        "200":
          description: "Duplicate email soft outcomes — outcome resent | invite_resent | ready (no enumeration)"
        "400": { description: "Validation error (i18n key in error)" }
        "429": { description: "Rate limited" }
  /api/public/contractor/signup:
    post:
      summary: "Contractor portal self-signup (pending; emails the prequalification application link — approving the application activates the login)"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201":
          description: "{ ok, outcome: created } — applicant + staff notified"
        "200":
          description: "Duplicate email soft outcomes — outcome resent | invite_resent | ready"
        "400": { description: "Validation error (i18n key in error)" }
        "429": { description: "Rate limited" }
  /api/public/affiliates/by-code/{code}:
    get:
      summary: "Public affiliate card for SPA /r/:code. Logs a click when the affiliate is active. Unknown/inactive → 404 errors.referralInactive. (The /r/:code page itself is SPA-owned, not an Express route.)"
      tags: [portal-public]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
