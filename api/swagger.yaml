      responses:
        "200":
          description: "OK { settings, notify_extra_emails }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  settings:
                    type: object
                    properties:
                      commission_payout_days_after_loan_close: { type: integer }
                      commission_cents_per_sqft: { type: integer, description: "Legacy alias of direct rate" }
                      commission_direct_cents_per_sqft: { type: integer }
                      commission_closer_cents_per_sqft: { type: integer }
                      commission_parent_cents_per_sqft: { type: integer }
                  notify_extra_emails:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        email: { type: string, format: email }
                        label: { type: string, nullable: true }
                        is_active: { type: boolean }
                        events:
                          type: array
                          nullable: true
                          description: "null = all alert types; else selected AdminNotifyEventKey values"
                          items: { type: string }
                        created_at: { type: string }
                  notify_event_keys:
                    type: array
                    description: "Catalog of AdminNotifyEventKey values for Settings toggles"
                    items: { type: string }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    put:
      summary: "Save commission settings"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `settings`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commission_payout_days_after_loan_close: { type: integer, minimum: 0, maximum: 365 }
                commission_cents_per_sqft: { type: integer, minimum: 0, description: "Legacy; mirrored to direct when direct omitted" }
                commission_direct_cents_per_sqft: { type: integer, minimum: 0 }
                commission_closer_cents_per_sqft: { type: integer, minimum: 0 }
                commission_parent_cents_per_sqft: { type: integer, minimum: 0 }
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
