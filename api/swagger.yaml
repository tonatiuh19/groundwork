      description: "Body AffiliateW9Body. Requires a signed agreement. SSN/EIN is validated, written only into the private PDF (Rev. March 2024 form, flattened, signed and dated); the database keeps tin_type + last 4. Resubmission allowed after a rejection."
      responses:
        "201": { description: "AffiliateOnboardingResponse" }
        "400": { description: "validation.w9Tin | validation.w9Classification | validation.w9LlcClass | validation.w9CertifyRequired | validation.signatureRequired" }
        "409": { description: "errors.agreementRequiredFirst | errors.w9AlreadySubmitted" }
