      responses:
        "200": { description: "{ connections[] } — includes expires_at (access) and refresh_expires_at" }
        "401": { description: "Not signed in" }
        "403": { description: "Not super_admin" }
  /api/admin/me/mcp-connections/{id}:
    delete:
