openapi: 3.0.3
info:
  title: Groundwork Capital API
  version: 0.1.0
  description: |
    Public lead capture, passwordless portal auth (admin / affiliate / contractor / client) and the portal feature layer (projects, loans, commissions, draws, contracts). Cookie-authenticated mutations under /api/(admin|affiliate|contractor|client)/ reject a foreign Origin header with 403. Errors return i18n keys (e.g. errors.forbidden, validation.invalidField).
    Independent HttpOnly cookies per actor. Emails send live whenever RESEND_API_KEY is set (local + prod); Vitest always dry-runs; NOTIFY_EMAILS=false forces dry-run.
servers:
  - url: /
paths:
  /api/admin/auth/otp/request:
    post:
      summary: Request admin email OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account. Body { email } or { phone } (any format, last 10 digits): a phone gets the 6-digit code by text (sending line, honors STOP: 409 errors.otpSmsUnavailable); a number shared by two live accounts answers 409 errors.phoneShared (use email). Codes are never stored in the person's message history."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/admin/auth/otp/verify:
    post:
      summary: Verify admin OTP (sets gw_admin_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid. Body { email, code } or { phone, code }."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/admin/auth/me:
    get:
      summary: Current admin
      tags: [portal-auth]
      description: |
        Includes Conversations fields when a brand Twilio line is assigned:
        conversations_enabled, assigned_phone_numbers, voice_available,
        call_forwarding_enabled, call_forwarding_phone.
        scorecard_enabled: true when SCORECARD_ENABLED is on and the role is super_admin or admin.
      responses:
        "200": { description: Admin user (+ conversations_* when numbered) }
        "401": { description: Unauthorized }
  /api/admin/auth/logout:
    post:
      summary: End admin session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/affiliate/auth/otp/request:
    post:
      summary: Request affiliate OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account. Body { email } or { phone } (any format, last 10 digits): a phone gets the 6-digit code by text (sending line, honors STOP: 409 errors.otpSmsUnavailable); a number shared by two live accounts answers 409 errors.phoneShared (use email). Codes are never stored in the person's message history."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/affiliate/auth/otp/verify:
    post:
      summary: Verify affiliate OTP (sets gw_affiliate_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid. Body { email, code } or { phone, code }."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/affiliate/auth/me:
    get:
      summary: Current affiliate
      tags: [portal-auth]
      responses:
        "200": { description: Affiliate user }
  /api/affiliate/auth/logout:
    post:
      summary: End affiliate session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/contractor/auth/otp/request:
    post:
      summary: Request contractor OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account. Body { email } or { phone } (any format, last 10 digits): a phone gets the 6-digit code by text (sending line, honors STOP: 409 errors.otpSmsUnavailable); a number shared by two live accounts answers 409 errors.phoneShared (use email). Codes are never stored in the person's message history."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/contractor/auth/otp/verify:
    post:
      summary: Verify contractor OTP (sets gw_contractor_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid. Body { email, code } or { phone, code }."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/contractor/auth/me:
    get:
      summary: Current contractor
      tags: [portal-auth]
      responses:
        "200": { description: Contractor user }
  /api/contractor/auth/logout:
    post:
      summary: End contractor session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/client/auth/otp/request:
    post:
      summary: Request homeowner OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account. Body { email } or { phone } (any format, last 10 digits): a phone gets the 6-digit code by text (sending line, honors STOP: 409 errors.otpSmsUnavailable); a number shared by two live accounts answers 409 errors.phoneShared (use email). Codes are never stored in the person's message history."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/client/auth/otp/verify:
    post:
      summary: Verify homeowner OTP (sets gw_client_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid. Body { email, code } or { phone, code }."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/client/auth/me:
    get:
      summary: Current homeowner
      tags: [portal-auth]
      responses:
        "200": { description: Client user }
  /api/client/auth/logout:
    post:
      summary: End homeowner session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  time:
                    type: string
  /api/ping:
    get:
      summary: Liveness ping
      responses:
        "200":
          description: pong
  /api/public/leads:
    post:
      description: "Standard (inquiry) leads no longer require soft_pull_consent. Event RSVPs get the A/B/C welcome text + email (see /api/public/lead-role)."
      summary: Submit a marketing / event lead (home form)
      description: |
        `mode=standard` (default): `soft_pull_consent` must be true (400 validation.consent). `event_id` is ignored.
        `mode=event` (event RSVP): `event_id` is required and `soft_pull_consent` is optional (defaults to false). The event must be published with registration open (409 errors.eventClosed; 404 errors.eventNotFound). Same email + event_id twice returns 409 errors.duplicate. When confirmed registrations reach `capacity`, the RSVP is `waitlisted` if the event has `waitlist_enabled`, otherwise 409 errors.eventFull. The confirmation email always includes the free credit report CTA (`credit_cta_url`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - phone
                - property_address
              properties:
                referral_code:
                  type: string
                  nullable: true
                  description: Affiliate tracking code captured from /r/CODE or ?ref=CODE (30-day window). Invalid codes are ignored.
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  description: At least 10 digits
                property_address:
                  type: string
                soft_pull_consent:
                  type: boolean
                  description: Required (true) when mode=standard. Optional for mode=event.
                preferred_language:
                  type: string
                  enum: [en, es]
                  description: UI language at submit; drives confirmation email locale and DB column
                mode:
                  type: string
                  enum: [event, standard]
                event_id:
                  type: integer
                  nullable: true
                  description: Required when mode=event (marketing_events.id). Ignored for standard.
                event_city:
                  type: string
                  nullable: true
                  description: Informational; for event RSVPs the stored city is taken from the event.
                source:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Lead created; confirmation + staff notify emails queued (or dry-run)
          content:
            application/json:
              schema:
                type: object
                required: [ok, lead_id, message]
                properties:
                  ok:
                    type: boolean
                  lead_id:
                    type: integer
                  message:
                    type: string
                  event_registration_status:
                    type: string
                    enum: [confirmed, waitlisted]
                    description: Present when mode=event
                  credit_cta_url:
                    type: string
                    description: Present when mode=event — next-step free credit report page
        "400":
          description: Validation error (validation.consent for standard without consent; validation.invalidField for event without event_id)
        "404":
          description: errors.eventNotFound (mode=event)
        "409":
          description: errors.eventClosed, errors.duplicate (same email + event) or errors.eventFull (full, no waitlist)
        "429":
          description: Rate limited
        "500":
          description: Server error
  /api/public/events:
    get:
      summary: Published events list (upcoming or past)
      tags: [public-events]
      description: "No auth. tab=upcoming (default; starts_at ASC) or tab=past (starts_at DESC). Past = the Pacific calendar day of ends_at (or starts_at) is over. Each PublicEventView includes is_past, cover_url (media cover → first photo → image_url) and media_count."
      parameters:
        - { name: tab, in: query, required: false, schema: { type: string, enum: [upcoming, past] } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200": { description: "{ ok, tab, events: PublicEventView[] }" }
        "500": { description: errors.server }
  /api/public/events/{slug}/qr-scan:
    post:
      summary: Count a flyer QR scan and resolve its landing
      tags: [public-events]
      description: "No auth (rate limited). Printed QR codes encode /e/<slug>; the SPA calls this, which increments marketing_events.qr_scan_count for a published event. Returns { ok, slug, register, event_id }: the scanned event while registration is open; once it is over/closed, the next live event (else the scanned slug with register=false for highlights). Unknown/unpublished slugs return the live event or slug=null (→ /events). RSVPs submitted after a scan use source='qr'."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: EventQrScanResponse }
        "429": { description: errors.tooMany }
  /api/public/events/live:
    get:
      summary: Live marketing event for the homepage (or null; never a past event)
      tags: [public-events]
      description: "No auth. Returns the featured published event with open registration, else the next published event with open registration by starts_at; `event` is null when none (homepage falls back to the standard form). Bilingual fields are resolved for `lang`."
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200":
          description: "{ ok, event: PublicEventView | null }"
          content:
            application/json:
              schema:
                type: object
                required: [ok, event]
                properties:
                  ok: { type: boolean }
                  event: { $ref: "#/components/schemas/PublicEventView", nullable: true }
        "500": { description: errors.server }
  /api/public/events/{slug}:
    get:
      summary: Public event detail by slug (published only)
      tags: [public-events]
      description: "No auth. Draft/archived/unknown slugs return 404 errors.eventNotFound. `registration_open` may be false (event detail stays visible after registration closes)."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200":
          description: "{ ok, event: PublicEventView }"
          content:
            application/json:
              schema:
                type: object
                required: [ok, event]
                properties:
                  ok: { type: boolean }
                  event: { $ref: "#/components/schemas/PublicEventView" }
        "404": { description: errors.eventNotFound }
        "500": { description: errors.server }
  /api/public/get-credit-report-lead:
    post:
      summary: Submit get-credit-report lead (OFG-parity fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - phone
                - preferred_language
                - soft_pull_consent
              properties:
                referral_code:
                  type: string
                  nullable: true
                  description: Affiliate tracking code captured from /r/CODE or ?ref=CODE (30-day window). Invalid codes are ignored.
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  description: At least 10 digits
                preferred_language:
                  type: string
                  enum: [en, es]
                soft_pull_consent:
                  type: boolean
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: |
            Lead created. Returns mfsn_url + short_url.
            Applicant welcome email includes the MyFreeScoreNow link (live when RESEND_API_KEY is set; dry-run under Vitest).
            Staff notify event key: get_credit_report_lead.
          content:
            application/json:
              schema:
                type: object
                required: [ok, lead_id, mfsn_url, short_url, email_sent, message]
                properties:
                  ok:
                    type: boolean
                  lead_id:
                    type: integer
                  mfsn_url:
                    type: string
                  short_url:
                    type: string
                  email_sent:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Validation error
        "429":
          description: Rate limited
  /go/free-score:
    get:
      summary: Redirect to MyFreeScoreNow free snapshot (same URL as OFG)
      responses:
        "302":
          description: Redirect to MFSN
  /api/public/go/free-score:
    get:
      summary: Same redirect under /api prefix
      responses:
        "302":
          description: Redirect to MFSN
  /go/{slug}:
    get:
      summary: Dynamic QR code (Admin -> QR codes)
      description: "Forwards to the code's current destination (site path or http(s) URL) and counts the scan (link-preview bots, crawlers, HEAD and prefetch requests are redirected but not counted). Unknown or switched-off codes go to /. Cache-Control no-store."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the destination }
  /api/public/go/{slug}:
    get:
      summary: Same dynamic QR redirect under /api prefix
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the destination }
  /api/admin/qr-links:
    get:
      summary: "List QR codes and event codes"
      tags: [portal-admin]
      description: "Requires `events`. Returns { ok, items: QrLink[], event_codes: QrEventCode[] }. QrLink includes destination, fallback, active, archived, scan_count, lead_count, application_count, short_url."
      responses:
        "200": { description: "{ ok, items, event_codes }" }
        "403": { description: "errors.forbidden" }
    post:
      summary: "Create a QR code"
      tags: [portal-admin]
      description: "Requires `events`. Body { slug, label, destination: { type: page|event|next_event|affiliate|external, key?, id? }, fallback? }. slug is permanent; 'free-score' is reserved. Destinations must be existing records; free-typed URLs are not accepted."
      responses:
        "201": { description: "{ ok, item }" }
        "400": { description: "validation.qrSlug | validation.qrLabel | validation.qrDestination" }
        "409": { description: "errors.qrSlugTaken" }
  /api/admin/qr-links/{id}:
    patch:
      summary: "Update a QR code"
      tags: [portal-admin]
      description: "Requires `events`. Body { label?, destination?, fallback? (null = home page), active?, archived? }. The slug never changes (ignored). Every change is logged."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, item }" }
        "400": { description: "validation.qrLabel | validation.qrDestination" }
        "404": { description: "errors.notFound" }
  /api/admin/qr-links/{id}/insights:
    get:
      summary: "Scans over 90 days, scans per destination, change history"
      tags: [portal-admin]
      description: "Requires `events`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, days, destinations, changes }" }
        "404": { description: "errors.notFound" }
  /api/admin/qr-destinations:
    get:
      summary: "Search what a QR code can point at"
      tags: [portal-admin]
      description: "Requires `events`. Query type=page|event|next_event|affiliate|external, q. Only published events, active affiliates and active approved links."
      parameters:
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ ok, options: [{ value, label, sub }] }" }
        "400": { description: "validation.qrDestination" }
  /api/admin/qr-external-links:
    get:
      summary: "List approved external links"
      tags: [portal-admin]
      description: "Requires `events`."
      responses:
        "200": { description: "{ ok, items }" }
    post:
      summary: "Add an approved external link"
      tags: [portal-admin]
      description: "Requires `approvals` (super_admin, admin). Body { label, url }. https only, no embedded login."
      responses:
        "201": { description: "{ ok, item }" }
        "400": { description: "validation.qrLabel | validation.qrExternalUrl" }
  /api/admin/qr-external-links/{id}:
    patch:
      summary: "Update an approved external link"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { label?, url?, active? }."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, item }" }
        "400": { description: "validation.qrLabel | validation.qrExternalUrl" }
        "404": { description: "errors.notFound" }
  /api/admin/mail/folders:
    get:
      summary: "List a mailbox's Outlook folders"
      tags: [portal-admin]
      parameters:
        - { name: mailbox_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, folders: [{ id, name, thread_count, unread }] }" }
    post:
      summary: "Create a folder in Outlook"
      tags: [portal-admin]
      description: "Needs send access to the mailbox. Body { mailbox_id, name }."
      responses:
        "201": { description: "{ ok, folders }" }
        "400": { description: "validation.mailFolderName" }
        "409": { description: "errors.mailFolderExists" }
  /api/admin/mail/folders/{id}:
    patch:
      summary: "Rename a folder in Outlook"
      tags: [portal-admin]
      description: "Body { mailbox_id, name }."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, folders }" }
    delete:
      summary: "Delete an empty folder"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: mailbox_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, folders }" }
        "409": { description: "errors.mailFolderNotEmpty" }
  /api/admin/mail/threads/{id}/move:
    post:
      summary: "File a thread in a folder (folder_id null = back to Inbox)"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, thread }" }
        "502": { description: "errors.mailMoveFailed" }
  /api/admin/mail/rules:
    get:
      summary: "List CRM and Outlook rules for a mailbox"
      tags: [portal-admin]
      parameters:
        - { name: mailbox_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, rules, outlook_error }" }
    post:
      summary: "Create a rule"
      tags: [portal-admin]
      description: "Body { mailbox_id, engine: outlook|crm, name, from?, subject?, person_kind? (crm), folder_id, mark_read? }. At least one condition. Outlook rules need MailboxSettings.ReadWrite."
      responses:
        "201": { description: "{ ok }" }
        "400": { description: "validation.mailRule" }
        "409": { description: "errors.mailRulesPermission" }
  /api/admin/mail/rules/{engine}/{id}:
    patch:
      summary: "Turn a rule on or off"
      tags: [portal-admin]
      description: "Body { mailbox_id, active }."
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok }" }
    delete:
      summary: "Delete a rule"
      tags: [portal-admin]
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: mailbox_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok }" }
  /api/public/cities:
    get:
      summary: "Cities for public sign-up pickers"
      tags: [public]
      responses:
        "200": { description: "{ ok, cities: [{ id, name }] }" }
  /api/admin/cities:
    get:
      summary: "Cities with counts and who covers each"
      tags: [portal-admin]
      description: "Any staff. Visibility only; never affects commissions."
      responses:
        "200": { description: "{ ok, cities }" }
    post:
      summary: "Add a city"
      tags: [portal-admin]
      description: "Requires `settings`. Body { name }."
      responses:
        "201": { description: "{ ok, cities }" }
        "400": { description: "validation.cityName" }
        "409": { description: "errors.cityExists" }
  /api/admin/cities/{id}/usage:
    get:
      summary: "What uses a city (before archive, merge or delete)"
      tags: [portal-admin]
      description: "settings. { usage: { leads, clients, projects, fees, people, activities, total } }."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, usage }" }
  /api/admin/cities/similar:
    get:
      summary: "Near-duplicate names before a quick add"
      tags: [portal-admin]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, matches: [{ id, name, archived }] }" }
