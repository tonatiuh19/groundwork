      description: "Gated by SCORECARD_ENABLED (404 when off) and `approvals` (super_admin, admin). Query q (2+ chars: name, email or phone). Excludes spam and closed leads. Returns { ok, items: ScorecardLeadHit[] }."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
