      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: mediaId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "404": { description: errors.notFound }
  /api/admin/events/{id}/attendees:
    get:
      summary: "RSVPs (leads) for an event"
