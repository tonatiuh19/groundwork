  /api/affiliate/onboarding/agreement:
    post:
      summary: "E-sign the Affiliate Agreement"
      tags: [portal-affiliate]
      description: "Body AffiliateAgreementSignBody { version, lang, legal_name, business_name?, title?, address, phone?, signature_image (PNG data URL), consent:true }. Requires an active affiliate with a staff-set subscription price. Spanish signing also signs the controlling English text. Stores a signed PDF (text + signature page + IP/UA/SHA-256 record) in the private Blob vault; notifies staff (affiliate_onboarding). 409 errors.agreementPricePending | errors.agreementAlreadySigned | errors.agreementVersionChanged."
      responses:
        "201": { description: "AffiliateOnboardingResponse" }
