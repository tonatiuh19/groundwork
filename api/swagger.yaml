                notes: { type: string }
                company: { type: string }
                phone: { type: string }
      responses:
        "200": { description: "OK" }
        "400": { description: "validation.invalidField / validation.slugFormat / validation.slugReserved" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
        "409": { description: "errors.slugTaken" }
