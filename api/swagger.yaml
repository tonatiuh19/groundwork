openapi: 3.0.3
info:
  title: Groundwork Capital API
  version: 0.1.0
  description: |
    Public lead capture, passwordless portal auth (admin / affiliate / contractor / client) and the portal feature layer (projects, loans, commissions, draws, contracts). Cookie-authenticated mutations under /api/(admin|affiliate|contractor|client)/ reject a foreign Origin header with 403. Errors return i18n keys (e.g. errors.forbidden, validation.invalidField).
    Independent HttpOnly cookies per actor. Emails send live whenever RESEND_API_KEY is set (local + prod); Vitest always dry-runs; NOTIFY_EMAILS=false forces dry-run.
servers:
  - url: /
paths:
  /api/admin/auth/otp/request:
    post:
      summary: Request admin email OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/admin/auth/otp/verify:
    post:
      summary: Verify admin OTP (sets gw_admin_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/admin/auth/me:
    get:
      summary: Current admin
      tags: [portal-auth]
      description: |
        Includes Conversations fields when a brand Twilio line is assigned:
        conversations_enabled, assigned_phone_numbers, voice_available,
        call_forwarding_enabled, call_forwarding_phone.
      responses:
        "200": { description: Admin user (+ conversations_* when numbered) }
        "401": { description: Unauthorized }
  /api/admin/auth/logout:
    post:
      summary: End admin session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/affiliate/auth/otp/request:
    post:
      summary: Request affiliate OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/affiliate/auth/otp/verify:
    post:
      summary: Verify affiliate OTP (sets gw_affiliate_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/affiliate/auth/me:
    get:
      summary: Current affiliate
      tags: [portal-auth]
      responses:
        "200": { description: Affiliate user }
  /api/affiliate/auth/logout:
    post:
      summary: End affiliate session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/contractor/auth/otp/request:
    post:
      summary: Request contractor OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/contractor/auth/otp/verify:
    post:
      summary: Verify contractor OTP (sets gw_contractor_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/contractor/auth/me:
    get:
      summary: Current contractor
      tags: [portal-auth]
      responses:
        "200": { description: Contractor user }
  /api/contractor/auth/logout:
    post:
      summary: End contractor session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/client/auth/otp/request:
    post:
      summary: Request homeowner OTP
      tags: [portal-auth]
      description: "Answers 200 {ok, sent} for unknown emails and for inactive/suspended accounts (no enumeration for those). Pending accounts answer 403 errors.authPending and invited accounts answer 403 errors.authInvited so the login form can show a legend. Answers 502 errors.otpSendFailed (code invalidated) if the email provider fails for an active account."
      responses:
        "200": { description: "OTP sent (or silently withheld for unknown/inactive)" }
        "400": { description: validation.emailInvalid }
        "403": { description: "errors.authPending / errors.authInvited" }
        "429": { description: errors.tooMany }
        "502": { description: errors.otpSendFailed }
  /api/client/auth/otp/verify:
    post:
      summary: Verify homeowner OTP (sets gw_client_sid)
      tags: [portal-auth]
      description: "Wrong code, unknown email and non-active accounts all answer 401 errors.authInvalid."
      responses:
        "200": { description: Authenticated }
        "400": { description: validation.otpInvalid }
        "401": { description: "errors.authInvalid / errors.authLocked" }
  /api/client/auth/me:
    get:
      summary: Current homeowner
      tags: [portal-auth]
      responses:
        "200": { description: Client user }
  /api/client/auth/logout:
    post:
      summary: End homeowner session
      tags: [portal-auth]
      responses:
        "200": { description: Logged out }
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  time:
                    type: string
  /api/ping:
    get:
      summary: Liveness ping
      responses:
        "200":
          description: pong
  /api/public/leads:
    post:
      summary: Submit a marketing / event lead (home form)
      description: |
        `mode=standard` (default): `soft_pull_consent` must be true (400 validation.consent). `event_id` is ignored.
        `mode=event` (event RSVP): `event_id` is required and `soft_pull_consent` is optional (defaults to false). The event must be published with registration open (409 errors.eventClosed; 404 errors.eventNotFound). Same email + event_id twice returns 409 errors.duplicate. When confirmed registrations reach `capacity`, the RSVP is `waitlisted` if the event has `waitlist_enabled`, otherwise 409 errors.eventFull. The confirmation email always includes the free credit report CTA (`credit_cta_url`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - phone
                - property_address
              properties:
                referral_code:
                  type: string
                  nullable: true
                  description: Affiliate tracking code captured from /r/CODE or ?ref=CODE (30-day window). Invalid codes are ignored.
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  description: At least 10 digits
                property_address:
                  type: string
                soft_pull_consent:
                  type: boolean
                  description: Required (true) when mode=standard. Optional for mode=event.
                preferred_language:
                  type: string
                  enum: [en, es]
                  description: UI language at submit; drives confirmation email locale and DB column
                mode:
                  type: string
                  enum: [event, standard]
                event_id:
                  type: integer
                  nullable: true
                  description: Required when mode=event (marketing_events.id). Ignored for standard.
                event_city:
                  type: string
                  nullable: true
                  description: Informational; for event RSVPs the stored city is taken from the event.
                source:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Lead created; confirmation + staff notify emails queued (or dry-run)
          content:
            application/json:
              schema:
                type: object
                required: [ok, lead_id, message]
                properties:
                  ok:
                    type: boolean
                  lead_id:
                    type: integer
                  message:
                    type: string
                  event_registration_status:
                    type: string
                    enum: [confirmed, waitlisted]
                    description: Present when mode=event
                  credit_cta_url:
                    type: string
                    description: Present when mode=event — next-step free credit report page
        "400":
          description: Validation error (validation.consent for standard without consent; validation.invalidField for event without event_id)
        "404":
          description: errors.eventNotFound (mode=event)
        "409":
          description: errors.eventClosed, errors.duplicate (same email + event) or errors.eventFull (full, no waitlist)
        "429":
          description: Rate limited
        "500":
          description: Server error
  /api/public/events/live:
    get:
      summary: Live marketing event for the homepage (or null)
      tags: [public-events]
      description: "No auth. Returns the featured published event with open registration, else the next published event with open registration by starts_at; `event` is null when none (homepage falls back to the standard form). Bilingual fields are resolved for `lang`."
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200":
          description: "{ ok, event: PublicEventView | null }"
          content:
            application/json:
              schema:
                type: object
                required: [ok, event]
                properties:
                  ok: { type: boolean }
                  event: { $ref: "#/components/schemas/PublicEventView", nullable: true }
        "500": { description: errors.server }
  /api/public/events/{slug}:
    get:
      summary: Public event detail by slug (published only)
      tags: [public-events]
      description: "No auth. Draft/archived/unknown slugs return 404 errors.eventNotFound. `registration_open` may be false (event detail stays visible after registration closes)."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200":
          description: "{ ok, event: PublicEventView }"
          content:
            application/json:
              schema:
                type: object
                required: [ok, event]
                properties:
                  ok: { type: boolean }
                  event: { $ref: "#/components/schemas/PublicEventView" }
        "404": { description: errors.eventNotFound }
        "500": { description: errors.server }
  /api/public/get-credit-report-lead:
    post:
      summary: Submit get-credit-report lead (OFG-parity fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - phone
                - preferred_language
                - soft_pull_consent
              properties:
                referral_code:
                  type: string
                  nullable: true
                  description: Affiliate tracking code captured from /r/CODE or ?ref=CODE (30-day window). Invalid codes are ignored.
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  description: At least 10 digits
                preferred_language:
                  type: string
                  enum: [en, es]
                soft_pull_consent:
                  type: boolean
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: |
            Lead created. Returns mfsn_url + short_url.
            Applicant welcome email includes the MyFreeScoreNow link (live when RESEND_API_KEY is set; dry-run under Vitest).
            Staff notify event key: get_credit_report_lead.
          content:
            application/json:
              schema:
                type: object
                required: [ok, lead_id, mfsn_url, short_url, email_sent, message]
                properties:
                  ok:
                    type: boolean
                  lead_id:
                    type: integer
                  mfsn_url:
                    type: string
                  short_url:
                    type: string
                  email_sent:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Validation error
        "429":
          description: Rate limited
  /go/free-score:
    get:
      summary: Redirect to MyFreeScoreNow free snapshot (same URL as OFG)
      responses:
        "302":
          description: Redirect to MFSN
  /api/public/go/free-score:
    get:
      summary: Same redirect under /api prefix
      responses:
        "302":
          description: Redirect to MFSN
  /api/public/contact:
    post:
      summary: Public contact form (SMS consent fields)
      description: |
        Most intents create a lead. intent=partner creates a pending affiliate (no lead),
        same as /api/public/partner-referral, and accepts optional referral_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - phone
                - intent
                - sms_transactional_consent
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                intent:
                  type: string
                  enum: [adu_project, financing, partner, general]
                preferred_language:
                  type: string
                  enum: [en, es]
                sms_transactional_consent:
                  type: boolean
                sms_marketing_consent:
                  type: boolean
                referral_code:
                  type: string
                  nullable: true
      responses:
        "201":
          description: |
            Lead stored (most intents) or pending affiliate when intent=partner.
            Confirmation + staff notify (dry-run under Vitest).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, lead_id, message]
                    properties:
                      ok: { type: boolean }
                      lead_id: { type: integer }
                      message: { type: string }
                  - type: object
                    required: [ok, affiliate_id, kind, message]
                    properties:
                      ok: { type: boolean }
                      affiliate_id: { type: integer }
                      kind: { type: string, enum: [partner_affiliate] }
                      message: { type: string }
        "400":
          description: Validation error
        "409":
          description: errors.affiliateExists / errors.emailExists* (intent=partner)
        "429":
          description: Rate limited
  /api/public/partner-referral:
    post:
      summary: Partner / referral program signup (creates pending affiliate, not a lead)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, phone]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                preferred_language:
                  type: string
                  enum: [en, es]
                referral_code:
                  type: string
                  nullable: true
                  description: From /r/:code or ?ref= — sets parent_affiliate_id when active
      responses:
        "201":
          description: Pending affiliate created; confirmation + staff notify (partner_referral event key)
          content:
            application/json:
              schema:
                type: object
                required: [ok, affiliate_id, message]
                properties:
                  ok: { type: boolean }
                  affiliate_id: { type: integer }
                  message: { type: string }
        "400":
          description: Validation error
        "409":
          description: errors.affiliateExists / errors.emailExistsClient / errors.emailExistsContractor
        "429":
          description: Rate limited
  /api/public/plans:
    get:
      summary: "List active ADU plans"
      tags: [portal-public]
      responses:
        "200": { description: "Plans (id, code, name, bedrooms, bathrooms, stories, sq_ft, images)" }
  /api/public/affiliate/signup:
    post:
      summary: "Affiliate self-signup (account starts pending admin approval)"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201": { description: "Application stored; staff notified (live when RESEND_API_KEY is set; dry-run under Vitest)" }
        "400": { description: "Validation error (i18n key in error)" }
        "409": { description: "errors.affiliateExists" }
        "429": { description: "Rate limited" }
  /api/public/client/signup:
    post:
      summary: "Homeowner portal self-signup (pending until staff approves → prospect + portal invite)"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                address_line1: { type: string, nullable: true }
                city: { type: string, nullable: true }
                zip: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201":
          description: "{ ok, outcome: created } — applicant + staff notified"
        "200":
          description: "Duplicate email soft outcomes — outcome resent | invite_resent | ready (no enumeration)"
        "400": { description: "Validation error (i18n key in error)" }
        "429": { description: "Rate limited" }
  /api/public/contractor/signup:
    post:
      summary: "Contractor portal self-signup (pending; emails the prequalification application link — approving the application activates the login)"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201":
          description: "{ ok, outcome: created } — applicant + staff notified"
        "200":
          description: "Duplicate email soft outcomes — outcome resent | invite_resent | ready"
        "400": { description: "Validation error (i18n key in error)" }
        "429": { description: "Rate limited" }
  /api/public/affiliates/by-code/{code}:
    get:
      summary: "Public affiliate card for SPA /r/:code. Logs a click when the affiliate is active. Unknown/inactive → 404 errors.referralInactive. (The /r/:code page itself is SPA-owned, not an Express route.)"
      tags: [portal-public]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: landing, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: "Affiliate card + landing key"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  affiliate:
                    type: object
                    properties:
                      first_name: { type: string }
                      last_name: { type: string }
                      company: { type: string, nullable: true }
                      avatar_url: { type: string, nullable: true }
                      bio: { type: string, nullable: true }
                      referral_code: { type: string }
                      slug: { type: string, nullable: true }
                      initials: { type: string }
                  landing: { type: string }
        "404": { description: "errors.referralInactive" }
        "429": { description: "errors.tooMany" }
  /api/public/enroll:
    post:
      summary: "Public homeowner enroll — creates prospect client + lead-milestone project, optional soft-pull, emails 5-day magic-link invite."
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone, property_address, homeowner_consent]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                property_address: { type: string }
                property_city: { type: string, nullable: true }
                property_zip: { type: string, nullable: true }
                adu_plan_id: { type: integer, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
                soft_pull_consent: { type: boolean, description: "Optional (default false)" }
                homeowner_consent: { type: boolean }
                referral_code: { type: string, nullable: true }
      responses:
        "201": { description: "{ ok, outcome: created, project_public_id, invite_sent } — lead + prospect client + project; portal magic link emailed" }
        "200": { description: "Returning person (no new records): outcome invite_resent (pending/prospect homeowner, fresh portal link) | exists (active homeowner or another role; staff get duplicate_blocked)" }
        "400": { description: "Validation error (i18n key in error)" }
        "429": { description: "Rate limited" }
  /api/public/client-invite/{token}:
    get:
      summary: "Preview a client portal magic-link invite (5-day TTL)"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Invite preview (first_name, email)" }
        "404": { description: "errors.inviteInvalid" }
  /api/public/client-invite/accept:
    post:
      summary: "Accept client portal invite — activates prospect→active, mints session cookie, returns PortalAuthResponse"
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: "Accepted; Set-Cookie gw_client_sid" }
        "404": { description: "errors.inviteInvalid" }
  /api/public/r/{code}:
    get:
      summary: "Compat redirect for advanced landings / old bookmarks. Prefer SPA /r/:code + by-code API. Unknown home/enroll → /r/expired."
      tags: [portal-public]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: "Redirect to SPA /r or marketing landing with ?ref=" }
  /api/public/contractor-invite/{token}:
    get:
      summary: "Preview a contractor invitation"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Invite preview (first_name, email, company)" }
        "404": { description: "errors.inviteInvalid" }
  /api/public/contractor-invite/accept:
    post:
      summary: "Accept a contractor invitation → starts the prequalification (contractor becomes pending; returns next=application + application_path). Already-approved applications activate (next=login)."
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: "Accepted" }
        "404": { description: "errors.inviteInvalid" }
  /api/affiliate/overview:
    get:
      summary: "Affiliate profile, tracking URL and stats (clicks, leads, clients, pipeline counts, commission totals, payout_days). Includes first_name, last_name, avatar_url, bio, parent_affiliate_id, can_manage_team for the public card / nav."
      tags: [portal-affiliate]
      description: "Requires the gw_affiliate_sid session cookie. Default tracking_url is SPA /r/{slug|code} (enrollment landing; slug auto-defaults from first-last name on create, with -2/-3 on collision). can_manage_team is true only for top-level affiliates (no parent)."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/affiliate/team:
    get:
      summary: "List sub-affiliates for this top-level affiliate"
      tags: [portal-affiliate]
      description: "Requires gw_affiliate_sid. Sub-affiliates receive errors.subCannotInvite / 403."
      responses:
        "200": { description: "{ ok, team[] }" }
        "401": { description: "Not signed in" }
        "403": { description: "errors.subCannotInvite or inactive" }
    post:
      summary: "Invite a sub-affiliate (activates immediately with welcome email)"
      tags: [portal-affiliate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201": { description: "{ ok, affiliate_id }" }
        "401": { description: "Not signed in" }
        "403": { description: "errors.subCannotInvite" }
        "409": { description: "errors.affiliateExists" }
  /api/affiliate/team/{id}:
    patch:
      summary: "Activate or deactivate an owned sub-affiliate"
      tags: [portal-affiliate]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200": { description: "OK" }
        "403": { description: "Not owner / sub cannot manage team" }
  /api/affiliate/team/{id}/resend:
    post:
      summary: "Resend sub-affiliate welcome email"
      tags: [portal-affiliate]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
  /api/affiliate/team/{id}/clients:
    get:
      summary: "Clients closed by an owned sub-affiliate"
      tags: [portal-affiliate]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, clients[] }" }
  /api/affiliate/team/{id}/commissions:
    get:
      summary: "Commissions for an owned sub-affiliate"
      tags: [portal-affiliate]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, commissions[] }" }
  /api/affiliate/me:
    get:
      summary: "Affiliate self profile (company, bio, referral_code, slug, avatar)"
      tags: [portal-affiliate]
      responses:
        "200": { description: "{ ok, profile }" }
        "401": { description: "Not signed in" }
    patch:
      summary: "Update affiliate profile fields (name, phone, company, language, bio, slug)"
      tags: [portal-affiliate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string, nullable: true }
                company: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
                bio: { type: string, nullable: true, maxLength: 500 }
                slug:
                  type: string
                  nullable: true
                  description: "Vanity /r/{slug}. Slugified server-side; null/empty clears (falls back to referral_code). Reserved words → validation.slugReserved; taken → errors.slugTaken."
      responses:
        "200": { description: "{ ok, user, profile }" }
        "400": { description: "validation.invalidField / validation.phoneMin / validation.slugFormat / validation.slugReserved" }
        "409": { description: "errors.slugTaken" }
  /api/affiliate/me/avatar:
    post:
      summary: "Upload cropped affiliate avatar (raw JPEG/PNG/WebP ≤4MB) to Vercel Blob"
      tags: [portal-affiliate]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: "{ ok, user } with avatar_url" }
        "400": { description: "validation.photoFile" }
        "503": { description: "errors.storageNotConfigured" }
  /api/affiliate/clients:
    get:
      summary: "Clients registered by or attributed to this affiliate (milestone only; no loan or money fields)"
      tags: [portal-affiliate]
      description: "Requires the gw_affiliate_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
    post:
      summary: "Register a homeowner (creates client + project). homeowner_consent must be true"
      tags: [portal-affiliate]
      description: "Requires the gw_affiliate_sid session cookie."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone, homeowner_consent]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                property_address: { type: string, nullable: true }
                adu_plan_id: { type: integer, nullable: true }
                homeowner_consent: { type: boolean }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201": { description: "Created (client + project public id)" }
        "400": { description: "validation.homeownerConsent or other validation error" }
        "401": { description: "Not signed in" }
        "409": { description: "errors.clientExists" }
  /api/affiliate/commissions:
    get:
      summary: "Own commissions with status and expected payout date"
      tags: [portal-affiliate]
      description: "Requires the gw_affiliate_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/contractor/projects:
    get:
      summary: "Projects assigned to the contractor (with budget and drawn totals)"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/contractor/projects/{publicId}:
    get:
      summary: "Assigned project detail (client contact, photos, draws, contracts)"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
        "404": { description: "errors.notFound (also for projects not assigned to this contractor)" }
  /api/contractor/photos:
    get:
      summary: "All photos the contractor uploaded"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/contractor/projects/{publicId}/photos:
    post:
      summary: "Add a progress photo by URL. Only https URLs on Vercel Blob (*.public.blob.vercel-storage.com) or hosts in PHOTO_URL_ALLOWED_HOSTS are accepted"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage_url]
              properties:
                storage_url: { type: string, description: "https:// URL on an allow-listed host" }
                caption: { type: string, nullable: true }
      responses:
        "201": { description: "Created" }
        "400": { description: "validation.photoUrl / errors.projectNotActive" }
        "401": { description: "Not signed in" }
        "404": { description: "errors.notFound" }
  /api/contractor/projects/{publicId}/photos/upload:
    post:
      summary: "Upload a progress photo (raw image bytes, JPEG/PNG/WebP, max 4 MB) to Vercel Blob and attach it to the project"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie and BLOB_READ_WRITE_TOKEN on the server. The Content-Type header must match the real image type (magic bytes are verified). Optional ?caption=."
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
        - { name: caption, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "201": { description: "Created { ok, id, storage_url }" }
        "400": { description: "validation.photoFile / errors.projectNotActive" }
        "401": { description: "Not signed in" }
        "404": { description: "errors.notFound (project not assigned to this contractor)" }
        "413": { description: "errors.payloadTooLarge" }
        "502": { description: "errors.storageFailed" }
        "503": { description: "errors.storageNotConfigured" }
  /api/contractor/contracts/{id}/pdf:
    get:
      summary: "Download a contractor_client contract as PDF (rendered from the stored snapshot)"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie. Only contracts on the contractor's own projects with status generated/sent/signed. ?lang=en|es (defaults to the contractor's preferred language)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200": { description: "application/pdf", content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { description: "Not signed in" }
        "404": { description: "errors.notFound" }
  /api/contractor/draws:
    get:
      summary: "Own draw requests"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/contractor/projects/{publicId}/draws:
    post:
      summary: "Create a draw request (status draft). Only while project is contracted or in_build; total capped by contractor cost"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { type: integer, minimum: 1 }
                note: { type: string, nullable: true }
      responses:
        "201": { description: "Created" }
        "400": { description: "validation.drawAmount" }
        "401": { description: "Not signed in" }
        "409": { description: "errors.projectNotActive / errors.drawExceedsBudget" }
  /api/contractor/draws/{id}/submit:
    post:
      summary: "Submit a draft draw for staff review (notifies staff)"
      tags: [portal-contractor]
      description: "Requires the gw_contractor_sid session cookie."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
        "404": { description: "errors.notFound" }
        "409": { description: "errors.invalidTransition" }
  /api/client/overview:
    get:
      summary: "Homeowner projects with milestone, plan, photos and timeline (no loan or money fields)"
      tags: [portal-client]
      description: "Requires the gw_client_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/client/documents:
    get:
      summary: "Contracts/documents for the homeowner (status only)"
      tags: [portal-client]
      description: "Requires the gw_client_sid session cookie."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
  /api/client/documents/{id}/pdf:
    get:
      summary: "Download one of the homeowner's documents as PDF (rendered from the stored snapshot)"
      tags: [portal-client]
      description: "Requires the gw_client_sid session cookie. Excludes affiliate_terms and draft/void contracts. ?lang=en|es (defaults to the client's preferred language)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200": { description: "application/pdf", content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { description: "Not signed in" }
        "404": { description: "errors.notFound (also for other clients' documents)" }
  /api/admin/dashboard:
    get:
      summary: "Queue counts and pipeline; finance block only when role has finance.read"
      tags: [portal-admin]
      description: "Requires gw_admin_sid (any admin role)."
      responses:
        "200":
          description: "OK — leads_new, affiliates_pending, clients_pending, contractors_pending, contractors_invited, draws_*, projects_by_milestone; finance when role has finance.read"
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/me:
    patch:
      summary: "Update signed-in admin profile (self only)"
      tags: [portal-admin]
      description: "Any active admin role. Patch first_name, last_name, phone (nullable), preferred_language. Email is not editable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "200": { description: "Updated user (same shape as /auth/me)" }
        "400": { description: "validation.invalidField / validation.phoneMin" }
        "401": { description: "Not signed in" }
  /api/admin/me/avatar:
    post:
      summary: "Upload cropped admin avatar to Vercel Blob"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and BLOB_READ_WRITE_TOKEN. Raw image body (JPEG/PNG/WebP, max 4 MB); Content-Type must match magic bytes. Stores a square public Blob URL on admins.avatar_url."
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: "Updated user with avatar_url" }
        "400": { description: "validation.photoFile" }
        "401": { description: "Not signed in" }
        "413": { description: "errors.payloadTooLarge" }
        "503": { description: "errors.storageNotConfigured" }
  /api/admin/me/notification-prefs:
    get:
      summary: "Get signed-in admin notification preferences"
      tags: [portal-admin]
      description: "Any active admin. Returns prefs (email/in_app/sms × event keys), channel availability, and event catalog."
      responses:
        "200": { description: "OK { prefs, channels, events }" }
        "401": { description: "Not signed in" }
    put:
      summary: "Update signed-in admin notification preferences"
      tags: [portal-admin]
      description: "Accepts channel_masters and/or per-channel event patches. SMS writes ignored when SMS channel unavailable (no Twilio or no assigned brand number)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_masters:
                  type: object
                  properties:
                    email: { type: boolean }
                    in_app: { type: boolean }
                    sms: { type: boolean }
                email:
                  type: object
                  additionalProperties: { type: boolean }
                in_app:
                  type: object
                  additionalProperties: { type: boolean }
                sms:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        "200": { description: "OK { prefs, channels, events }" }
        "401": { description: "Not signed in" }
  /api/admin/me/notifications:
    get:
      summary: "List signed-in admin in-app notifications"
      tags: [portal-admin]
      description: "Inbox from admin_notifications. Query limit 1–50 (default 20). Includes unread_count."
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: "OK { notifications, unread_count }" }
        "401": { description: "Not signed in" }
  /api/admin/me/notifications/read:
    post:
      summary: "Mark in-app notifications read"
      tags: [portal-admin]
      description: "Body { all: true } or { ids: number[] }. Returns updated unread_count."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean }
                ids:
                  type: array
                  items: { type: integer }
      responses:
        "200": { description: "OK { unread_count }" }
        "401": { description: "Not signed in" }
  /api/admin/me/ably-token:
    get:
      summary: "Mint Ably TokenRequest for admin bell (and conversations when unlocked)"
      tags: [portal-admin]
      description: "Any active admin. Always includes subscribe on admin:{id}:notifications. Adds admin:{id}:conversations (subscribe+presence) when the admin has an assigned brand phone number. Softphone ringing uses Twilio Device SDK, not Ably."
      responses:
        "200": { description: "OK { tokenRequest }" }
        "401": { description: "Not signed in" }
        "503": { description: "ably_not_configured" }
  /api/admin/campaigns:
    get:
      summary: "List marketing campaigns"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `campaigns`."
      responses:
        "200": { description: "OK { campaigns }" }
        "401": { description: "Not signed in" }
        "403": { description: "Missing campaigns permission" }
    post:
      summary: "Create a draft campaign"
      tags: [portal-admin]
      description: "Body: name, audience_kind (leads|affiliates|contractors), audience_filter, channels, optional preset=fontana_followup (seeds bilingual CTA opener + reply_1..4; when event_id omitted, resolves marketing event slug fontana-oct-6)."
      responses:
        "201": { description: "Created { campaign }" }
        "400": { description: "validation.invalidField" }
        "401": { description: "Not signed in" }
        "403": { description: "Missing campaigns permission" }
  /api/admin/campaigns/{id}:
    get:
      summary: "Get one campaign with templates"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK { campaign }" }
        "404": { description: "errors.notFound" }
    patch:
      summary: "Update draft campaign filter/channels/templates"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK { campaign }" }
        "409": { description: "errors.conflict when not draft/failed" }
    delete:
      summary: "Delete a campaign (not while sending)"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
  /api/admin/campaigns/{id}/preview:
    post:
      summary: "Preview audience counts and recipient list for review"
      tags: [portal-admin]
      description: "Returns totals (email/SMS eligibility, EN/ES) plus `sample` recipients (up to 1000) and `sample_truncated` when capped."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "OK { preview: { total, email_eligible, sms_eligible, sms_skipped_no_consent, by_lang, sample[], sample_truncated } }"
  /api/admin/campaigns/{id}/send:
    post:
      summary: "Dry-run or live-send a campaign"
      tags: [portal-admin]
      description: "Body { dry_run: true } or { confirm: true }. Live email uses Resend transactional sends (personalized opener per recipient). SMS requires sms_marketing_consent and a brand From number."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK { dry_run, stats, campaign }" }
        "400": { description: "confirm required for live send" }
        "409": { description: "errors.conflict" }
  /api/admin/plans:
    get:
      summary: "List ADU plans (all, including inactive)"
      tags: [portal-admin]
      description: "Requires gw_admin_sid (any admin role)."
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/plans/{id}:
    patch:
      summary: "Update an ADU plan"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `plans.write`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Any subset of fields"
              properties:
                name: { type: string }
                description: "{ type: string, nullable: true }"
                layout_image_url: { type: string, nullable: true }
                exterior_image_url: { type: string, nullable: true }
                is_active: { type: boolean }
                sort_order: { type: integer }
                bedrooms: { type: integer }
                stories: { type: integer }
                sq_ft: { type: integer }
                default_commission_cents: { type: integer }
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/events:
    get:
      summary: "List marketing events (query: status, q, limit, offset) — returns total"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `events` or `leads`. Each event includes confirmed_count, waitlisted_count and registration_open."
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, published, archived] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Matches slug, titles, city" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: "OK { events: MarketingEvent[], total, limit, offset }" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    post:
      summary: "Create a marketing event"
      tags: [portal-admin]
      description: "Requires permission `events` (super_admin | admin | content). Creating with is_featured=true un-features all other events."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Writable event fields (PATCH: any subset). POST requires starts_at, city, title_en (title_es defaults to title_en); slug defaults to a slugified title_en."
              properties:
                slug: { type: string, description: "Unique; slugified server-side (409 errors.duplicate)" }
                status: { type: string, enum: [draft, published, archived] }
                is_featured: { type: boolean, description: "Setting true clears the flag on every other event" }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time, nullable: true }
                registration_opens_at: { type: string, format: date-time, nullable: true, description: "Defaults to created_at when null" }
                registration_closes_at: { type: string, format: date-time, nullable: true, description: "Defaults to starts_at when null" }
                capacity: { type: integer, nullable: true, description: "null = unlimited" }
                waitlist_enabled: { type: boolean }
                city: { type: string }
                venue_name: { type: string, nullable: true }
                venue_address: { type: string, nullable: true }
                zoom_url: { type: string, nullable: true }
                image_url: { type: string, nullable: true }
                title_en: { type: string }
                title_es: { type: string }
                summary_en: { type: string, nullable: true }
                summary_es: { type: string, nullable: true }
                body_en: { type: string, nullable: true }
                body_es: { type: string, nullable: true }
                location_label_en: { type: string, nullable: true }
                location_label_es: { type: string, nullable: true }
                cta_en: { type: string, nullable: true }
