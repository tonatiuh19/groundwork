        "201": { description: "{ ok, id }" }
        "400": { description: "validation.scKind | validation.scOutcome | validation.scNote | validation.scLead | validation.scProject | validation.scWhen" }
        "409": { description: "errors.scWeekFrozen" }
  /api/admin/scorecards/activities/{id}:
    delete:
