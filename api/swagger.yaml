      responses:
        "302": { description: "Redirect to consent UI" }
        "400": { description: "invalid_request" }
  /api/mcp/oauth/token:
    post:
      summary: "OAuth token (authorization_code + PKCE S256, refresh_token)"
      tags: [mcp]
      responses:
        "200": { description: "access_token + refresh_token" }
        "400": { description: "invalid_grant / invalid_request" }
  /api/mcp/oauth/revoke:
    post:
      summary: "OAuth token revocation"
      tags: [mcp]
      responses:
        "200": { description: "revoked" }
  /api/admin/mcp/oauth/approve:
    post:
      summary: "Approve or deny MCP OAuth consent (super_admin cookie)"
      tags: [mcp]
      description: "Requires gw_admin_sid and role=super_admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, code_challenge, approve]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string }
                scope: { type: string }
                resource: { type: string }
                state: { type: string }
                approve: { type: boolean }
      responses:
        "200": { description: "{ redirect_to }" }
        "401": { description: "Not signed in" }
        "403": { description: "Not super_admin" }
