    get:
      summary: "Automations an event can start on RSVP"
      tags: [portal-admin]
      description: "Requires permission `events` or `leads`. Lists automations with trigger event_rsvp (on first, then by name); seeds the 'Event RSVP welcome (A / B / C)' automation switched off if missing."
      responses:
        "200": { description: "OK { flows: [{ id, name, is_active }] }" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal or missing permission" }
  /api/admin/events/{id}:
    get:
