        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "ProjectTracking" }
  /api/admin/scorecards/projects/{publicId}/corrections:
    post:
      summary: "Log a city correction"
      tags: [portal-admin]
