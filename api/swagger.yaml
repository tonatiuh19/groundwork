      description: "Requires the gw_affiliate_sid session cookie. Default tracking_url is SPA /r/{slug|code} (enrollment landing; slug auto-defaults from first-last name on create, with -2/-3 on collision). can_manage_team is true only for top-level affiliates (no parent)."
      responses:
        "200": { description: "OK" }
