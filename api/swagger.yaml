  /api/admin/search/records:
    get:
      summary: "Staff search across clients, leads and projects (pickers)"
      tags: [portal-admin]
      description: "Any staff session; groups follow permissions (people.read → clients, leads → leads, projects.read → projects). q ≥ 2 chars; matches name, email, phone (digits), address or project id. Up to 6 per group."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, clients[], leads[], projects[] }" }
  /api/admin/people/{entity}/{id}/erase-preview:
    get:
      summary: "What deleting this person removes (confirm modal)"
      tags: [portal-admin]
      description: "entity also accepts lead (erases the lead, its appointments and CRM email copies; a client / affiliate / contractor it became is kept). Perm approvals (super admin, admin). entity: client | affiliate | contractor. Returns counts to delete, records kept-but-unlinked, subscription / card flags and stored-file count."
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, enum: [client, affiliate, contractor] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, person, counts, kept, subscription, card_on_file, files }" }
        "403": { description: "errors.forbidden" }
        "404": { description: "errors.notFound" }
  /api/admin/people/{entity}/{id}:
    delete:
      summary: "Erase a person completely (cannot be undone)"
      tags: [portal-admin]
      description: "Perm approvals. Body { confirm: true, reason? }. Cancels any subscription and deletes the processor customer, then removes the record, sign-in access, their projects (clients) with photos / draws / contracts / commissions, appointments, conversations, agreements / W-9 (affiliates), application documents / draws (contractors), their source lead and stored files. People they're linked to (referred homeowners, sub-affiliates, assigned projects) are kept and unlinked. Logged in people_dedupe_log (action delete)."
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, enum: [client, affiliate, contractor] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, person, counts, kept, … }" }
        "400": { description: "validation.confirmRequired" }
        "403": { description: "errors.forbidden" }
        "404": { description: "errors.notFound" }
  /api/admin/command-center:
    get:
      summary: "Staff dashboard: what needs you now, today's appointments, money, activity, trends — by role"
      tags: [portal-admin]
      description: "Any staff session. Sections follow permissions: inbox items (leads, approvals, applications, draws, unread texts, billing past due / paused / free periods ending, commissions, upcoming events, scheduled campaigns), appointments today (Pacific; projects.read), money (finance.read: membership MRR, commissions, pipeline value by stage, closed net), activity (last 14 days), trends (12 weekly buckets, 90-day funnel, lead sources, event RSVPs). Query mine=1 narrows appointments and conversations to the viewer."
      parameters:
        - { name: mine, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: "{ ok, role, generated_at, inbox[], appointments[], money|null, activity[], trends|null }" }
        "401": { description: "errors.unauthorized" }
  /api/admin/billing/card-links/eligible:
    get:
      summary: "Count approved members who should get an add-card link"
      tags: [portal-admin]
      description: "Requires `finance.write`. Active affiliates / contractors whose billing_status is not trialing or active, with a price above $0, and no unused card link sent in the last 3 days. Returns { ok, count, affiliates, contractors }."
      responses:
        "200": { description: "{ ok, count, affiliates, contractors }" }
        "403": { description: "errors.forbidden" }
  /api/admin/billing/card-links/send-all:
    post:
      summary: "Email + text every eligible member their secure add-card link"
      tags: [portal-admin]
      description: "Requires `finance.write`. Body { confirm: true }. Same eligibility as /eligible; each member gets the standard card-link email + SMS (their price and free period) and a card_link entry in the billing action log."
      responses:
        "200": { description: "{ ok, sent, failed }" }
        "400": { description: "validation.confirmRequired" }
        "403": { description: "errors.forbidden" }
  /api/admin/billing/overview:
    get:
      summary: "Admin → Billing: totals + every contractor / affiliate membership"
      tags: [portal-admin]
      description: "Perm people.read. totals: mrr_cents (active + past_due monthly price), active, trialing, past_due, paused, trials_ending_7d, awaiting_approval, canceling. members[]: role, id, name, email, company, member_status, billing, locked."
      responses:
        "200": { description: "{ ok, configured, totals, members[] }" }
  /api/admin/billing/{role}/{id}:
    get:
      summary: "One membership: plan, card, last 12 invoices (refunds + receipts), staff action log, open card link"
      tags: [portal-admin]
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, member, billing, locked, invoices[], actions[], open_link }" }
        "404": { description: "errors.notFound" }
  /api/admin/billing/{role}/{id}/cancel:
    post:
      summary: "Cancel a membership now or at period end"
      tags: [portal-admin]
      description: "Perm finance.write. Body { when: now | period_end, reason }. Logged; the member is emailed."
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "400": { description: "validation.billingReasonRequired" }
        "409": { description: "errors.billingNoPlan" }
  /api/admin/billing/{role}/{id}/resume:
    post:
      summary: "Undo a period-end cancellation"
      tags: [portal-admin]
      description: "Perm finance.write."
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "409": { description: "errors.billingNoPlan | errors.billingAlreadyEnded" }
  /api/admin/billing/{role}/{id}/extend:
    post:
      summary: "Add courtesy free days (no charge until the new date)"
      tags: [portal-admin]
      description: "Perm finance.write. Body { days: 1-365, reason }. Moves the plan's free-period end past the later of now / current free end / next charge; nothing prorated. Logged; member emailed."
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "400": { description: "validation.invalidField | validation.billingReasonRequired" }
        "409": { description: "errors.billingNoPlan | errors.billingAlreadyEnded" }
  /api/admin/billing/{role}/{id}/refund:
    post:
      summary: "Refund all or part of a paid invoice to the member's card"
      tags: [portal-admin]
      description: "Perm finance.write. Body { invoice_id, amount_cents? (default: everything not yet refunded), reason }. The invoice must belong to this member. Logged; member emailed."
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, refund: { id, amount_cents, status } }" }
        "400": { description: "validation.invalidField | validation.refundAmount | validation.billingReasonRequired" }
        "404": { description: "errors.notFound" }
        "409": { description: "errors.billingNothingToRefund" }
  /api/admin/billing/{role}/{id}/price:
    patch:
      summary: "Set the monthly price (null = default / agreement price, 0 = waived)"
      tags: [portal-admin]
      description: "Perm finance.write. Body { price_cents, reason? }. Affiliates: overrides the agreement price going forward. A live plan moves to the new price next cycle; 0 cancels it."
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "400": { description: "validation.invalidField" }
  /api/admin/billing/{role}/{id}/card-link:
    post:
      summary: "Manual start: email + text the member a secure link to add their card"
      tags: [portal-admin]
      description: "Perm finance.write. Body { price_cents?, free_days? (0-365), note? }. Approved members without a running plan only. One live link per member (14 days); staff never handle card data."
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [contractor, affiliate] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: "{ ok, sent }" }
        "409": { description: "errors.billingNotApproved | errors.billingAlreadyActive" }
  /api/public/billing-link/{token}:
    get:
      summary: "Member's secure card link: terms preview"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, member, billing, expires_at }" }
        "404": { description: "errors.billingLinkInvalid" }
  /api/public/billing-link/{token}/setup:
    post:
      summary: "Setup secret for the card form (card link)"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, client_secret }" }
        "404": { description: "errors.billingLinkInvalid" }
  /api/public/billing-link/{token}/activate:
    post:
      summary: "Save the card and start the plan with the staff terms; the link is then used up"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, billing }" }
        "404": { description: "errors.billingLinkInvalid" }
        "409": { description: "errors.cardNotConfirmed" }
  /api/webhooks/billing:
    post:
      summary: "Payment processor webhook (subscription + invoice events)"
      tags: [webhooks]
      description: "Verified by signature over the raw body when available; otherwise the event is re-fetched from the processor by id. Idempotent (billing_webhook_events). Syncs affiliates.billing_* / contractors.billing_* (by metadata affiliate_id / contractor_id, or customer); card details refreshed by the bank (payment_method.automatically_updated / payment_method.updated) update the stored brand / last 4 / expiry; payment failures and renewals that need bank authentication (invoice.payment_action_required) email the member and alert staff (a failed contractor payment pauses the contractor portal)."
      responses:
        "200": { description: "{ received: true }" }
        "400": { description: "errors.invalidSignature | validation.invalidField" }
  /api/affiliate/faqs:
    get:
      summary: "Active affiliate FAQ (EN/ES)"
      tags: [portal-affiliate]
      description: "Affiliate session or welcome link."
      responses:
        "200": { description: "{ ok, faqs[] }" }
  /api/admin/affiliate-faqs:
    get:
      summary: "All affiliate FAQ entries"
      tags: [portal-admin]
      description: "Requires `people.read`."
      responses:
        "200": { description: "{ ok, faqs[] }" }
    post:
      summary: "Add an affiliate FAQ entry"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { question_en, answer_en, question_es?, answer_es?, sort_order?, is_active? }."
      responses:
        "201": { description: "{ ok, faqs[] }" }
        "400": { description: "validation.faqRequired" }
  /api/admin/affiliate-faqs/{id}:
    put:
      summary: "Edit an affiliate FAQ entry"
      tags: [portal-admin]
      description: "Requires `approvals`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, faqs[] }" }
        "404": { description: "errors.notFound" }
    delete:
      summary: "Delete an affiliate FAQ entry"
      tags: [portal-admin]
      description: "Requires `approvals`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, faqs[] }" }
  /api/affiliate/assistant:
    get:
      summary: "Affiliate assistant history"
      tags: [portal-affiliate]
      description: "Affiliate session or welcome link. Returns { enabled, messages[] }."
      responses:
        "200": { description: "{ ok, enabled, messages[] }" }
    post:
      summary: "Ask the affiliate assistant"
      tags: [portal-affiliate]
      description: "Body { message, lang? }. Answers only from the affiliate's agreement + the FAQ (Claude). Questions it can't answer are handed off to staff (handoff: true + staff alert). 40 questions per affiliate per day."
      responses:
        "200": { description: "{ ok, reply, handoff }" }
        "429": { description: "errors.assistantDailyLimit | errors.assistantBusy" }
        "503": { description: "errors.assistantNotConfigured" }
  /api/admin/affiliates/{id}/assistant:
    get:
      summary: "An affiliate's assistant conversation (staff review)"
      tags: [portal-admin]
      description: "Requires `people.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, messages[] }" }
  /api/admin/affiliates/{id}/welcome:
    post:
      summary: "Re-send the affiliate welcome (presentation + new secure link)"
      tags: [portal-admin]
      description: "Requires `approvals`. Revokes older links."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok }" }
  /api/admin/affiliates/{id}/billing:
    get:
      summary: "An affiliate's billing status"
      tags: [portal-admin]
      description: "Requires `people.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing }" }
  /api/admin/lenders:
    get:
      summary: "Lenders directory"
      tags: [portal-admin]
      description: "Requires `projects.read`. Each lender includes project_count."
      responses:
        "200": { description: "{ ok, lenders[] }" }
    post:
      summary: "Add a lender"
      tags: [portal-admin]
      description: "Requires `projects.write`. Body { company, contact_name?, email?, phone?, preferred_language?, notes?, is_active? }."
      responses:
        "201": { description: "{ ok, lenders[] }" }
        "400": { description: "validation.lenderCompany | validation.emailInvalid" }
  /api/admin/lenders/{id}:
    put:
      summary: "Edit a lender"
      tags: [portal-admin]
      description: "Requires `projects.write`. Linked projects keep loan_lender_name in sync."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, lenders[] }" }
        "404": { description: "errors.notFound" }
  /api/admin/appointments:
    get:
      summary: "Appointments in a range (calendar)"
      tags: [portal-admin]
      description: "Requires `projects.read`. Query from, to (≤120 days), client_id, project_id, lead_id, admin_id (owner or tagged), include_cancelled=1."
      responses:
        "200": { description: "{ ok, appointments[] }" }
    post:
      summary: "Schedule an appointment"
      tags: [portal-admin]
      description: "Requires `projects.write`. Body { kind, date (YYYY-MM-DD), start (HH:mm), duration_minutes, timezone?, location_type: onsite|office|phone|video, location?, video_url?, description? (shared), notes? (internal), client_id? | lead_id? | project_id?, owner_admin_id?, notify_homeowner, attendees: [{kind:'admin',admin_id}|{kind:'contractor',contractor_id}|{kind:'lender',lender_id}|{kind:'guest',name,email?,phone?}] }. Owner is always tagged; the homeowner is added when notify_homeowner. Everyone gets email + calendar invite (.ics) and a text; onsite defaults to the property address. Overlaps return as `conflicts` (warning, not a block); Outlook events marked Free never count. teams_meeting: true creates a Teams meeting on the owner's connected Outlook calendar (join link saved to video_url). With a connected mailbox, the appointment is also written onto the owner's and tagged staff's Outlook calendars (no Outlook attendees, so people only get the CRM invite); edits and cancellations follow. Appointments with source outlook came from Outlook and never trigger CRM invites or reminders."
      responses:
        "201": { description: "{ ok, appointment, conflicts[] }" }
        "400": { description: "validation.appointmentTime | validation.attendeeContact | validation.invalidReference" }
  /api/admin/appointments/{id}:
    get:
      summary: "One appointment"
      tags: [portal-admin]
      description: "Requires `projects.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, appointment }" }
        "404": { description: "errors.notFound" }
    patch:
      summary: "Edit / reschedule an appointment"
      tags: [portal-admin]
      description: "Requires `projects.write`. Any create field. Time / place changes bump the invite sequence and send 'updated' invites; newly tagged people get the invite, untagged ones get a cancellation. Reminders reset when the time changes. client_id / lead_id / project_id set or clear who it's for (a project implies its client)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, appointment, conflicts[] }" }
        "409": { description: "errors.appointmentCancelled" }
  /api/admin/appointments/{id}/cancel:
    post:
      summary: "Cancel an appointment"
      tags: [portal-admin]
      description: "Requires `projects.write`. Body { reason? }. Everyone tagged gets a cancellation (METHOD:CANCEL invite)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
  /api/admin/appointments/{id}/status:
    post:
      summary: "Mark completed / no-show"
      tags: [portal-admin]
      description: "Requires `projects.write`. Body { status: completed|no_show|scheduled }."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "404": { description: "errors.notFound" }
  /api/contractor/appointments:
    get:
      summary: "My appointments (contractor)"
      tags: [portal-contractor]
      description: "Appointments the contractor is tagged on (last 30 days onward). No internal notes."
      responses:
        "200": { description: "{ ok, appointments[] }" }
  /api/affiliate/appointments:
    get:
      summary: "Appointments for my referred clients"
      tags: [portal-affiliate]
      description: "Time, type and status only (no address / notes)."
      responses:
        "200": { description: "{ ok, appointments[] }" }
  /api/admin/scheduler:
    get:
      summary: "My booking link settings"
      tags: [portal-admin]
      description: "Any staff. Creates defaults on first use (Mon–Fri 9–5, disabled). Returns settings, availability, upcoming blocked ranges and booking_url (/book/:slug)."
      responses:
        "200": { description: "{ ok, settings, booking_url, blocked[] }" }
    put:
      summary: "Update my booking link"
      tags: [portal-admin]
      description: "Any staff. is_enabled, slug, titles/descriptions (EN/ES), kind, duration_minutes, buffer_minutes, advance_days, min_notice_hours, timezone, allow_phone/video/office/onsite, video_url, availability[] (day_of_week 0–6, HH:mm)."
      responses:
        "200": { description: "{ ok, settings, booking_url }" }
        "409": { description: "errors.slugTaken" }
        "400": { description: "validation.availability" }
  /api/admin/scheduler/blocked:
    post:
      summary: "Block time off on my booking link"
      tags: [portal-admin]
      description: "Body { from_date, to_date?, from_time?, to_time?, label? } in the link's timezone."
      responses:
        "201": { description: "OK" }
  /api/admin/scheduler/blocked/{id}:
    delete:
      summary: "Remove a blocked range"
      tags: [portal-admin]
      description: "Own ranges only."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
  /api/public/book/{slug}:
    get:
      summary: "Public booking page info"
      tags: [public]
      description: "Host name, title / description (lang), duration, timezone, location types, weekdays with availability. 404 when disabled."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "PublicBookingInfo" }
        "404": { description: "errors.notFound" }
    post:
      summary: "Book a time"
      tags: [public]
      description: "Rate limited. Body { date, time, name, email, phone, location_type, address? (onsite), notes?, lang }. Slot re-checked at booking (409 errors.slotTaken). Matches an existing client / lead by email or phone, else creates a lead (source booking). Host + booker get email + invite; the booker's email has a manage link."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "{ ok, appointment_id }" }
        "409": { description: "errors.slotTaken" }
  /api/public/book/{slug}/slots:
    get:
      summary: "Open times for a day"
      tags: [public]
      description: "Query date=YYYY-MM-DD. Availability minus appointments (with buffer), blocked ranges, minimum notice and booking horizon."
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, date, slots[] }" }
  /api/public/appointments/{token}:
    get:
      summary: "Manage my appointment (booker / homeowner)"
      tags: [public]
      description: "Token from the confirmation email."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "PublicAppointmentView" }
        "404": { description: "errors.notFound" }
  /api/public/appointments/{token}/cancel:
    post:
      summary: "Cancel my appointment"
      tags: [public]
      description: "Body { reason? }."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OK" }
        "409": { description: "errors.appointmentPast" }
  /api/public/appointments/{token}/reschedule:
    post:
      summary: "Reschedule my appointment"
      tags: [public]
      description: "Body { date, time } — must be an open slot on the host's booking link."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OK" }
        "409": { description: "errors.slotTaken | errors.rescheduleUnavailable" }
  /api/cron/appointment-reminders:
    get:
      summary: "Vercel Cron: appointment reminders"
      tags: [cron]
      description: "Bearer CRON_SECRET. Hourly (at :30): 24h reminders, and a 'coming up today' reminder 1 to 2 hours before (skipped when booked inside the window)."
      responses:
        "200": { description: "{ ok, reminded_24h, reminded_1h }" }
        "401": { description: "errors.unauthorized" }
    post:
      summary: "Manual run of appointment reminders"
      tags: [cron]
      description: "Same as GET."
      responses:
        "200": { description: "{ ok, reminded_24h, reminded_1h }" }
  /api/affiliate/link:
    get:
      summary: "My referral link (EN/ES URLs, short display, stats, link-name rule)"
      tags: [portal-affiliate]
      description: "Returns { slug, referral_code, urls: { en, es (?lang=es) }, display, can_change_slug_at, stats: { clicks_total, clicks_7d, leads, clients } }."
      responses:
        "200": { description: "AffiliateLinkInfo" }
    patch:
      summary: "Change my link name (disabled: staff-only)"
      tags: [portal-affiliate]
      description: "Link names are staff-only so printed QRs and shared links never break. Always 403; admins rename via PATCH /api/admin/affiliates/{id} (the old name keeps resolving)."
      responses:
        "403": { description: "errors.slugStaffOnly" }
  /api/affiliate/link/flyer:
    get:
      summary: "Printable homeowner flyer (PDF) with my QR + link"
      tags: [portal-affiliate]
      description: "Query lang=en|es. Letter-size branded flyer: headline, bullets, QR to the (language) link, short URL, 'Referred by'."
      responses:
        "200": { description: "application/pdf" }
  /api/admin/duplicates/merge:
    post:
      summary: "Merge one duplicate into a survivor of the same role"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { entity: lead|client|affiliate|contractor, keep_id, remove_id, reason?, dry_run? }. Moves every reference (projects, commissions, conversations, leads, invites, campaign history…), fills the survivor's blanks, deletes the duplicate, audits to people_dedupe_log. dry_run returns { moves, blockers, warnings }."
      responses:
        "200": { description: "{ ok, dry_run, moves, blockers, warnings }" }
        "409": { description: "errors.mergeBlocked { blockers[] }" }
  /api/admin/duplicates/delete:
    post:
      summary: "Delete a duplicate record when nothing meaningful is linked"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { entity, id, reason?, dry_run? }. Clients may drop empty pipeline projects (lead/cancelled, no contract/draw/photo/commission) with them."
      responses:
        "200": { description: "{ ok, dry_run, blockers, removed_projects }" }
        "409": { description: "errors.deleteBlocked { blockers[] }" }
