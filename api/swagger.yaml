              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201": { description: "{ ok, affiliate_id }" }
        "401": { description: "Not signed in" }
        "403": { description: "errors.forbidden (inactive affiliate)" }
        "409": { description: "errors.affiliateExists" }
