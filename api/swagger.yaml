components:
  schemas:
    PublicEventView:
      type: object
      description: "Public event payload; bilingual fields resolved for the requested lang (falls back to the other language)."
      required: [id, slug, city, starts_at, waitlist_enabled, confirmed_count, registration_open, title]
      properties:
        id: { type: integer }
        slug: { type: string }
        city: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, nullable: true }
        waitlist_enabled: { type: boolean }
        confirmed_count: { type: integer }
        spots_remaining: { type: integer, nullable: true, description: "null when capacity is unlimited" }
        registration_open: { type: boolean }
        venue_name: { type: string, nullable: true }
        venue_address: { type: string, nullable: true }
        zoom_url: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        title: { type: string }
        summary: { type: string, nullable: true }
        body: { type: string, nullable: true }
        location_label: { type: string, nullable: true }
        cta: { type: string, nullable: true }
