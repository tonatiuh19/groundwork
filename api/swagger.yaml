  /api/mcp:
    post:
      summary: "Remote MCP Streamable HTTP (super_admin OAuth Bearer or gw_admin_sid)"
      tags: [mcp]
      description: |
        Claude/Cursor MCP endpoint. Auth: Bearer mcp_oauth_tokens access token
        or admin session cookie. Must be role=super_admin and status=active.
        Writes require confirm=true + confirm_phrase=CONFIRM (dry-run otherwise).
        Tool surface includes ADU ops plus Conversations/Contacts (SMS, CRM contacts,
        brand phone numbers; WhatsApp tools stubbed as not configured).
      responses:
        "200": { description: "JSON-RPC MCP response" }
        "401": { description: "Unauthorized (WWW-Authenticate challenge)" }
        "405": { description: "GET not allowed — use POST" }
    get:
      summary: "MCP GET rejected (use POST)"
      tags: [mcp]
      responses:
        "405": { description: "use_post" }
    options:
      summary: "CORS preflight"
      tags: [mcp]
      responses:
        "204": { description: "No content" }
  /api/mcp/:
    post:
      summary: "Remote MCP Streamable HTTP (trailing slash alias)"
      tags: [mcp]
      responses:
        "200": { description: "JSON-RPC MCP response" }
        "401": { description: "Unauthorized" }
  /api/mcp/oauth/register:
    post:
      summary: "OAuth dynamic client registration (Claude/Cursor)"
      tags: [mcp]
      responses:
        "201": { description: "Registered public client" }
        "400": { description: "invalid_redirect_uri" }
  /api/mcp/oauth/authorize:
    get:
      summary: "OAuth authorize — redirects to /admin/mcp-consent"
