  # ── Conversations Contact Hub ───────────────────────────────────────────────
  /api/admin/conversations/access:
    get:
      summary: Conversations access gate (assigned brand number required)
      tags: [conversations]
      responses:
        "200": { description: "{ enabled, numbers[] }" }
        "401": { description: Unauthorized }
  /api/admin/conversations/badge:
    get:
      summary: Nav unread badge total
      tags: [conversations]
      responses:
        "200": { description: "{ unread_total }" }
        "403": { description: conversations_number_required }
  /api/admin/conversations/ably-token:
    get:
      summary: Mint Ably token request for Conversations realtime
      tags: [conversations]
      responses:
        "200": { description: "{ tokenRequest }" }
        "403": { description: conversations_number_required }
        "503": { description: ably_not_configured }
  /api/admin/conversations:
    get:
      summary: Contact-centric inbox (client + CRM contact + unknown)
      tags: [conversations]
      description: |
        Unknown threads include `match` (role, id, name, others) when the number belongs to a client, affiliate, contractor, contact, lead or staff member; `display_name` then shows that name.
        True SQL pagination via UNION ALL of client, CRM contact, and unknown
        hub rows (shared columns), ORDER BY last_message_at DESC, with separate
        COUNT for total. Supports view + q filters.
      parameters:
        - in: query
          name: view
          schema:
            {
              type: string,
              enum: [all, mine, unassigned, unread, unknown, open, closed],
            }
        - in: query
          name: q
          schema: { type: string }
          description: Server-side search across name/phone/email/preview
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: "{ contacts[], pagination }" }
        "403": { description: conversations_number_required }
  /api/admin/conversations/media/upload:
    post:
      summary: Upload MMS media to Vercel Blob
      tags: [conversations]
      description: |
        Raw body with Content-Type set to the media MIME type (image/*, video/mp4, audio/*, application/pdf).
        Optional X-Filename header. Returns public Blob URL in url/cdn_url.
      responses:
        "200": { description: "{ success, url, cdn_url, content_type, id }" }
        "400": { description: validation.invalidField }
        "403": { description: conversations_number_required }
  /api/conversations/media:
    get:
      summary: Proxy Twilio or Vercel Blob conversation media
      tags: [conversations]
      description: |
        Authenticated staff proxy for MMS/recording URLs. Only allows
        `https://api.twilio.com/...` (fetched with account Basic auth) and
        Vercel Blob hosts. Rejects other origins (SSRF guard).
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, format: uri }
      responses:
        "200": { description: Binary media stream }
        "400": { description: validation.invalidField }
        "401": { description: Unauthorized }
        "503": { description: Twilio credentials missing for Twilio URL }
  /api/conversations/media/public/{id}:
    get:
      summary: Public MMS media by id (expiring Blob/local fallback)
      tags: [conversations]
      description: |
        Unauthenticated fetch for a single `mms_media` row by UUID.
        Redirects to `cdn_url` when present; otherwise streams stored bytes.
        Returns 404 when missing or expired.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Binary media stream }
        "302": { description: Redirect to Vercel Blob CDN URL }
        "400": { description: Invalid media ID }
        "404": { description: Not found or expired }
  /api/admin/conversations/contact/client/{id}/assign:
    post:
      summary: Assign open client conversation threads (default assign-to-me)
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_admin_id:
                  type: integer
                  nullable: true
      responses:
        "200": { description: "{ ok, assigned_admin_id }" }
        "403": { description: conversations_number_required }
  /api/admin/conversations/unknown/{id}/link:
    post:
      summary: Link unknown contact thread to a client
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: integer }
      responses:
        "200": { description: "{ ok, client_id }" }
  /api/admin/conversations/unknown/{id}/create-prospect:
    post:
      summary: Create client prospect from unknown contact and link threads
      description: "Name, email and language default to the most recent open lead with the same phone (body fields override); that lead gets client_id so it leaves the Active leads list. Response adds lead_id (or null)."
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ ok, client_id }" }
        "409": { description: duplicate_phone / duplicate_email }
  /api/admin/conversations/unknown/{id}/dismiss:
    post:
      summary: Dismiss unknown contact from inbox
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ ok: true }" }
  /api/admin/conversations/lookup-contact:
    get:
      summary: Resolve phone to client/contact for softphone UI
      tags: [conversations]
      parameters:
        - in: query
          name: phone
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ found, client_id?, client_name?, kind? }" }
  /api/admin/conversations/send:
    post:
      summary: Send SMS (or internal note) on an existing thread
      tags: [conversations]
      description: |
        Body requires exactly one of client_id, unknown_contact_id, contact_id plus body and/or media_url.
        Under VITEST=true Twilio SMS always dry-runs (provider_message_id dry-run-*).
      responses:
        "200": { description: Send result }
        "400": { description: validation.invalidField }
        "403": { description: conversations_number_required }
  /api/admin/conversations/lead-search:
    get:
      summary: Leads matching a Conversations search (name / email / phone)
      tags: [conversations]
      description: "q ≥ 2 chars; up to 8 leads that are not affiliates/contractors and not spam, newest first. Each has unknown_contact_id (open unknown-number thread for that phone) and client_id when already linked. { ok, leads: ConversationLeadMatch[] }."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
  /api/admin/conversations/start:
    post:
      summary: Start SMS by phone (client → contact → unknown)
      description: "400 errors.noPhoneLine when the admin has no assigned Groundwork number."
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                body: { type: string, description: Required unless media_url set }
                media_url:
                  type: string
                  description: Vercel Blob HTTPS URL or mms_media UUID
                media_content_type: { type: string }
                ofg_number_id: { type: integer }
      responses:
        "200": { description: "{ kind, conversation_id, ... }" }
        "400": { description: validation.invalidField }
        "403": { description: conversations_number_required }
  /api/admin/conversations/contact/{kind}/{id}/read:
    post:
      summary: Mark contact thread(s) read (clear unread)
      tags: [conversations]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [client, contact, unknown] }
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ ok: true }" }
        "403": { description: conversations_number_required }
  /api/admin/conversations/contact/{kind}/{id}/status:
    post:
      summary: Close or reopen conversation threads
      tags: [conversations]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [client, contact, unknown] }
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        "200": { description: "{ ok, status }" }
        "403": { description: conversations_number_required }
  /api/admin/conversations/contact/{kind}/{id}/timeline:
    get:
      summary: Thread timeline (also clears unread)
      tags: [conversations]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [client, contact, unknown] }
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ kind, contact, threads, messages }" }
        "403": { description: conversations_number_required }
  /api/admin/conversation-templates/{id}/used:
    post:
      summary: Bump a template's usage count (when inserted into a message)
      tags: [conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok }" }
  /api/admin/phone-lines/available:
    get:
      summary: Twilio numbers on the account not yet connected to Groundwork
      tags: [conversations]
      description: "super_admin / admin. Each has current_host + in_use_elsewhere (another app's webhooks, e.g. Encore)."
      responses:
        "200": { description: "{ ok, numbers: AvailableTwilioNumber[] }" }
        "403": { description: errors.forbidden }
  /api/admin/phone-lines/connect:
    post:
      summary: Connect a Twilio number (sets Groundwork webhooks) as a personal or shared line
      tags: [conversations]
      description: "super_admin / admin. Body { sid, line_mode (personal|shared), assigned_admin_id (required for personal), take_over (required when another app answers it) }. 409 errors.lineInUseElsewhere without take_over."
      responses:
        "201": { description: PhoneLineSettings }
        "400": { description: "validation.personalLineOwner | validation.invalidField" }
        "404": { description: errors.notFound }
        "409": { description: errors.lineInUseElsewhere }
  /api/admin/phone-lines/{id}/disconnect:
    post:
      summary: Disconnect a line (clears our webhooks only if they still point here; history kept)
      tags: [conversations]
      description: "Also removes the line from the CRM lists (removed_at). The number stays in Twilio until released there; Sync Twilio never re-adds a removed line; connecting it again restores it. super_admin / admin. Body { confirm: <exact e164> }. The main (primary) line can't be disconnected."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok }" }
        "400": { description: validation.confirmNumber }
        "409": { description: errors.cannotDisconnectPrimary }
  /api/admin/phone-lines/{id}:
    get:
      summary: Phone line settings (members, ring phones, ring time, bilingual voicemail, live summary)
      tags: [conversations]
      description: "super_admin / admin. Returns PhoneLineSettings incl. `now` (what rings right now)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: PhoneLineSettings }
        "403": { description: errors.forbidden }
    put:
      summary: Save phone line settings
      tags: [conversations]
      description: "super_admin / admin. Body PhoneLineSettingsBody { line_mode (shared | personal — personal needs an owner and has no members; visible to owner + all admins; deactivated owner → main shared line team), assigned_admin_id, members[{admin_id, ring_browser}] (super_admin/admin/agent only), ring_numbers[{label, e164, is_active}] (≤5, US, never another brand line), ring_timeout_sec 10–60, voicemail_greeting_en/es (≤600, null = default) }. Members see the line's conversations and calls."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: PhoneLineSettings }
        "400": { description: "validation.ringNumberInvalid | validation.ringNumberLoop | validation.ringNumberLimit | validation.invalidField" }
        "403": { description: errors.forbidden }
  /api/admin/conversation-templates:
    get:
      summary: List SMS conversation templates
      tags: [conversations]
      parameters:
        - in: query
          name: all
          schema: { type: string, enum: ["1"] }
          description: Include inactive templates when all=1
      responses:
        "200":
          description: "?channel=sms (default) | email | all. Templates have channel sms|email; email templates need subject_en (subject_es optional). { templates[] }"
        "401": { description: Unauthorized }
    post:
      summary: Create conversation template (admin/super_admin + people.write)
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body_en]
              properties:
                title: { type: string }
                body_en: { type: string }
                body_es: { type: string, nullable: true }
                sort_order: { type: integer }
      responses:
        "201": { description: "{ template }" }
        "403": { description: Forbidden }
  /api/admin/conversation-templates/{id}:
    patch:
      summary: Update conversation template
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ template }" }
        "404": { description: Not found }
    delete:
      summary: Delete conversation template
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Not found }
  /api/admin/contacts:
    get:
      summary: List CRM contacts
      tags: [conversations]
      responses:
        "200": { description: "{ contacts[], pagination }" }
    post:
      summary: Create CRM contact
      tags: [conversations]
      responses:
        "201": { description: "{ contact }" }
        "400": { description: validation error }
  /api/admin/contacts/{id}:
    get:
      summary: Get CRM contact
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ contact }" }
        "404": { description: errors.notFound }
    put:
      summary: Update CRM contact
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ contact }" }
    delete:
      summary: Soft-delete CRM contact
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ ok: true }" }
  /api/admin/contacts/{id}/convert:
    post:
      summary: Convert CRM contact to client prospect (or link existing)
      description: >
        Requires phone and/or email on the contact. Creates a prospect client
        (clients.email may be null for phone-only) or links an existing client
        matched by phone/email without creating a twin. Re-links Conversations
        from contact_id → client_id.
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ ok, client_id, contact_id, existing?, linked_existing? }" }
        "400": { description: "Missing phone and email, or invalid email" }
        "404": { description: "Contact not found / already converted" }
  /api/admin/phone-numbers:
    get:
      summary: List brand Twilio numbers (all for admin/super_admin; mine for others)
      tags: [conversations]
      responses:
        "200": { description: "{ numbers[] }" }
  /api/admin/phone-numbers/sync-twilio:
    post:
      summary: Upsert Twilio IncomingPhoneNumbers (super_admin / staff)
      tags: [conversations]
      description: Under VITEST returns dry_run without calling Twilio.
      responses:
        "200": { description: "{ ok, upserted, skipped, numbers[] } — only numbers whose SMS or voice webhook points at this app (PUBLIC_APP_URL host) are imported; other brands' lines on the shared Twilio account are skipped" }
        "403": { description: errors.forbidden }
  /api/admin/phone-numbers/{id}:
    patch:
      summary: Assign brand number to admin (admin or super_admin)
      tags: [conversations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_admin_id: { type: integer, nullable: true }
                friendly_name: { type: string, nullable: true }
      responses:
        "200": { description: "{ number }" }
  /api/voice/token:
    post:
      summary: Mint Twilio Voice SDK access token (identity admin_{id})
      tags: [conversations]
      responses:
        "200": { description: "{ success, token }" }
        "503": { description: Twilio / TwiML App unavailable }
  /api/voice/twiml:
    post:
      summary: TwiML App voice webhook for outbound softphone dials
      tags: [conversations]
      responses:
        "200": { description: TwiML XML }
  /api/voice/availability:
    post:
      summary: Toggle admin softphone availability (voice_available)
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        "200": { description: "{ success, available }" }
  /api/voice/voicemail-settings:
    get:
      summary: Admin + tenant voicemail settings
      tags: [conversations]
      responses:
        "200": { description: "{ success, admin, tenant }" }
    put:
      summary: Update admin voicemail override
      tags: [conversations]
      responses:
        "200": { description: "{ success: true }" }
  /api/voice/log:
    post:
      summary: Log inbound/outbound call into conversation_messages
      tags: [conversations]
      responses:
        "200": { description: "{ success }" }
  /api/voice/call-answered:
    post:
      summary: Mark call message answered
      tags: [conversations]
      responses:
        "200": { description: "{ success }" }
  /api/voice/recording-status:
    post:
      summary: Twilio recording status callback
      tags: [conversations]
      description: |
        On RecordingStatus=completed, stores recording_url, merges metadata
        `{ recording_sid, transcript_status: pending }`, and requests a Twilio
        Recording Transcription (skipped under VITEST). Publishes Ably `call_recording`.
      responses:
        "204": { description: No content }
        "403": { description: Invalid Twilio signature }
  /api/voice/call-transcript:
    post:
      summary: Twilio Voice v3 transcription callback
      tags: [conversations]
      description: |
        Callback set on the `groundwork_call_transcript` transcription
        configuration (Deepgram nova-3, language multi = EN/ES auto, channel 1
        Caller / 2 Agent), created through the API on first use. Payload is only
        a pointer (`id`): the job is re-fetched from voice.twilio.com with our
        credentials and must match the message's recording_sid; then
        `{ transcript, transcript_status: ready|failed }` is stored (voicemail
        preview + assignee email) and Ably `call_transcript` is published.
      responses:
        "200": { description: "{ ok: true } (always, so Twilio doesn't retry forever)" }
  /api/admin/conversations/messages/{id}/transcribe:
    post:
      summary: Start / retry a transcript for a recorded call
      tags: [conversations]
      description: Requires Conversations access. If a job exists and is pending, re-reads it (recovers a missed webhook); otherwise submits the recording_sid to Twilio Voice v3 Transcriptions.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, transcript_status: pending|ready|failed }" }
        "404": { description: errors.notFound }
        "409": { description: "errors.noRecording | errors.transcriptReady" }
        "503": { description: errors.transcriptionNotConfigured }
  /api/voice/transcription:
    post:
      summary: Legacy Twilio <Record transcribe> callback (kept for in-flight callbacks)
      tags: [conversations]
      description: |
        On TranscriptionStatus completed|failed, finds the call message by
        RecordingSid in metadata_json or CallSid = provider_message_id, merges
        `{ transcript, transcript_status: ready|failed, recording_sid }`, and
        optionally updates voicemail body preview. For voicemail only, emails
        the conversation assignee the transcript (or a listen-in-inbox note if
        transcription failed). Answered-call transcripts are not emailed.
        Retries skip when `voicemail_transcript_emailed_at` is already set.
        Publishes Ably `call_transcript`.
      responses:
        "204": { description: No content }
        "403": { description: Invalid Twilio signature }
  /api/voice/screen:
    post:
      summary: Call screening for ring phones ("Groundwork Capital call, press 1 to accept", EN/ES)
      tags: [webhooks]
      description: "Twilio <Number url> on cell legs. Gather 1 digit → /api/voice/screen-accept; no input → that leg hangs up (other legs keep ringing)."
      responses:
        "200": { description: TwiML Gather }
        "403": { description: Invalid signature }
  /api/voice/screen-accept:
    post:
      summary: Screening result — Digits=1 bridges the call, anything else drops this leg
      tags: [webhooks]
      responses:
        "200": { description: TwiML (empty = connect, Hangup = decline) }
        "403": { description: Invalid signature }
  /api/voice/dial-status:
    post:
      summary: Twilio Dial action callback (no answer → the line's bilingual voicemail; never a hang-up)
      tags: [conversations]
      responses:
        "200": { description: TwiML XML }
  /api/voice/call-forwarding:
    get:
      summary: Get call-forwarding settings for numbered staff
      tags: [conversations]
      responses:
        "200": { description: "{ success, call_forwarding_enabled, call_forwarding_phone }" }
        "403": { description: conversations_number_required }
    put:
      summary: Update call-forwarding (personal cell simultaneous ring)
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                phone: { type: string }
      responses:
        "200": { description: Updated settings }
        "403": { description: conversations_number_required }
  /api/voice/incoming:
    post:
      summary: Twilio inbound voice webhook (one call plan per line)
      tags: [webhooks]
      description: |
        Validates X-Twilio-Signature when TWILIO_AUTH_TOKEN is set.
        Resolves To → line; the Phone line settings decide what rings: members with
        "Ring in CRM" whose softphone is online (Client admin_{id}) + the line's ring
        phones (screened via /api/voice/screen so carrier voicemail can't answer), for
        ring_timeout_sec. Lines with no members use the owner's softphone + personal
        forwarding. Nothing to ring, errors, or no answer → the line's bilingual voicemail
        (never a hang-up). CallerID = the brand line.
      responses:
        "200": { description: TwiML Dial or voicemail }
        "403": { description: Invalid signature }
        "503": { description: Auth token missing in production }
  /api/webhooks/twilio/sms:
    post:
      summary: Twilio inbound SMS webhook
      tags: [webhooks]
      description: |
        Validates X-Twilio-Signature when TWILIO_AUTH_TOKEN is set.
        Production without TWILIO_AUTH_TOKEN returns 503.
        Matches client → CRM contact → unknown; notifies assignee (alert SMS + email).
        HELP/STOP keywords are logged only in v1 (no auto-replies).
        Vitest skips signature validation.
      responses:
        "200": { description: TwiML empty Response }
        "403": { description: Invalid signature }
        "503": { description: Auth token missing in production }
  /api/webhooks/twilio/sms-status:
    post:
      summary: Twilio outbound SMS status callback
      tags: [webhooks]
      responses:
        "200": { description: ok }
        "403": { description: Invalid signature }
        "503": { description: Auth token missing in production }

components:
  schemas:
    PublicEventView:
      type: object
      description: "Public event payload; bilingual fields resolved for the requested lang (falls back to the other language)."
      required: [id, slug, city, starts_at, waitlist_enabled, confirmed_count, registration_open, title]
      properties:
        id: { type: integer }
        slug: { type: string }
        city: { type: string }
        city_id: { type: integer, nullable: true, description: "Picked city (service_cities). Wins over the typed city and fills it with the city name; a typed city alone is tagged only on an exact name match. Unknown or archived id → 400 validation.invalidField." }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, nullable: true }
        waitlist_enabled: { type: boolean }
        confirmed_count: { type: integer }
        spots_remaining: { type: integer, nullable: true, description: "null when capacity is unlimited" }
        registration_open: { type: boolean }
        venue_name: { type: string, nullable: true }
        venue_address: { type: string, nullable: true }
        zoom_url: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        title: { type: string }
        summary: { type: string, nullable: true }
        body: { type: string, nullable: true }
        location_label: { type: string, nullable: true }
        cta: { type: string, nullable: true }
