      tags: [portal-admin]
      description: "Requires `approvals`. Body { content_type, size_bytes }. Photos ≤ 15 MB (image/jpeg|png|webp), videos ≤ 500 MB (video/mp4|quicktime|webm). Returns { ok, client_token, pathname } (pathname under events/{id}/, 30-minute token)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
