    get:
      summary: "List affiliates (query: status, q, limit, offset) — returns total"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `people.read`."
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, active, inactive, suspended] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Matches name, email, company, slug, referral_code" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: "OK { affiliates, total, limit, offset }" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
