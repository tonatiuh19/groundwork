      description: "Requires permission `events` or `leads`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK { event: MarketingEvent }" }
        "404": { description: errors.eventNotFound }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    patch:
      summary: "Update a marketing event"
      tags: [portal-admin]
      description: "Requires permission `events`. Archive via status=archived (closes registration and hides the public page). is_featured=true un-features every other event."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Writable event fields (PATCH: any subset). POST requires starts_at, city, title_en (title_es defaults to title_en); slug defaults to a slugified title_en."
              properties:
                slug: { type: string, description: "Unique; slugified server-side (409 errors.duplicate)" }
                status: { type: string, enum: [draft, published, archived] }
                is_featured: { type: boolean, description: "Setting true clears the flag on every other event" }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time, nullable: true }
                registration_opens_at: { type: string, format: date-time, nullable: true, description: "Defaults to created_at when null" }
                registration_closes_at: { type: string, format: date-time, nullable: true, description: "Defaults to starts_at when null" }
                capacity: { type: integer, nullable: true, description: "null = unlimited" }
                waitlist_enabled: { type: boolean }
                city: { type: string }
                city_id: { type: integer, nullable: true, description: "Picked city (service_cities). Wins over the typed city and fills it with the city name; a typed city alone is tagged only on an exact name match. Unknown or archived id → 400 validation.invalidField." }
                venue_name: { type: string, nullable: true }
                venue_address: { type: string, nullable: true }
                zoom_url: { type: string, nullable: true }
                image_url: { type: string, nullable: true }
                title_en: { type: string }
                title_es: { type: string }
                summary_en: { type: string, nullable: true }
                summary_es: { type: string, nullable: true }
                body_en: { type: string, nullable: true }
                body_es: { type: string, nullable: true }
                location_label_en: { type: string, nullable: true }
                location_label_es: { type: string, nullable: true }
                cta_en: { type: string, nullable: true }
                cta_es: { type: string, nullable: true }
                rsvp_flow_id: { type: integer, nullable: true, description: "Automation (trigger event_rsvp) started for each RSVP while it is on; null = no automatic messages. Other triggers → 400 validation.invalidField." }
      responses:
        "200": { description: "OK { event }" }
        "400": { description: validation.invalidField }
        "404": { description: errors.eventNotFound }
        "409": { description: errors.duplicate (slug taken) }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    delete:
      summary: "Delete a marketing event"
      tags: [portal-admin]
      description: "Requires permission `events`. Only unpublished events with zero RSVPs can be deleted; otherwise 409 errors.invalidTransition — archive via PATCH instead."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "404": { description: errors.eventNotFound }
        "409": { description: errors.invalidTransition }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/events/{id}/media:
    get:
      summary: "Event photos / videos / reel embeds (admin)"
      tags: [portal-admin]
      description: "Requires `events` or `leads`. { ok, media: AdminEventMedia[] } (highlight reel first, then sort_order)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
