              type: object
              description: "Any subset. Side effects: loan finalized creates a pending commission (payout delay from settings); leaving finalized voids unpaid commissions; in_build requires an active contractor; affiliate cannot change after finalize (errors.projectLocked). Milestone changes follow a state machine: forward one step (financing may be skipped), back one step, any active stage -> cancelled, closed -> in_build only, cancelled -> lead only; anything else is 409 errors.invalidTransition. The check runs under a row lock, so concurrent moves cannot both win."
