        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                company: { type: string }
                license_number: { type: string }
                phone: { type: string }
      responses:
        "201": { description: "Invited; email sent" }
        "409": { description: "errors.contractorExists / errors.contractorInvited" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/contractors/{id}:
    get:
      summary: "Contractor detail"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `people.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK { contractor }" }
        "404": { description: "errors.notFound" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    patch:
      summary: "Update contractor"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `approvals`. Setting status from pending → active requires an approved prequalification application; a super_admin may pass `override_reason` (5+ chars, audited on the application). Emails a portal login notice. Invited rows cannot change status via PATCH (use invite flow)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Any subset of fields"
              properties:
                status: { type: string, enum: [pending, active, inactive, suspended] }
                notes: { type: string }
                company: { type: string }
                license_number: { type: string }
                phone: { type: string }
                override_reason: { type: string, description: "super_admin only: activate without an approved prequalification" }
      responses:
        "200": { description: "OK" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
        "409": { description: "errors.contractorInvited when patching status on an invited row; errors.contractorApplicationRequired / errors.contractorOverrideReasonRequired when activating without an approved prequalification" }
  /api/admin/clients:
    get:
      summary: "List clients (query: status, q, limit, offset) — returns total"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `people.read`."
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, prospect, active, inactive, suspended] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: "OK { clients, total, limit, offset }" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    post:
      summary: "Create a client and project"
      tags: [portal-admin]
      description: "POST also sends the portal invite by email + text unless body send_invite=false (response invite_sent). Requires gw_admin_sid and permission `people.write`. Email or phone (at least one; 400 validation.emailOrPhoneOne): phone-only homeowners get the portal invite by text."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                property_address: { type: string }
                adu_plan_id: { type: integer, nullable: true }
                affiliate_id: { type: integer, nullable: true }
      responses:
        "201": { description: "Created" }
        "409": { description: "errors.clientExists" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/clients/{id}:
    get:
      summary: "Client detail"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `people.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK { client }" }
        "404": { description: "errors.notFound" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    patch:
      summary: "Update client"
      tags: [portal-admin]
      description: "PATCH lender_id (Lenders directory, null clears): projects that had no lender or the old one follow it (loan_lender_type anchor when the lender is Anchor, else external). GET returns lender_id / lender_company / lender_contact / lender_phone / lender_email. Requires gw_admin_sid and permission `people.write`. Setting status from pending → prospect also requires `approvals` and issues a portal invite email. An email change (sign-in identity) notifies the old and new address and is audited (people_dedupe_log action=email_change)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Any subset of fields"
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, nullable: true, description: "Portal login email; null clears. Must be unique when set." }
                phone: { type: string }
                status: { type: string, enum: [pending, prospect, active, inactive, suspended] }
                address_line1: { type: string }
                city: { type: string }
                city_id: { type: integer, nullable: true, description: "Picked city (service_cities). Wins over the typed city and fills it with the city name; a typed city alone is tagged only on an exact name match. Unknown or archived id → 400 validation.invalidField." }
                zip: { type: string }
                affiliate_id: { type: integer, nullable: true }
                assigned_admin_id: { type: integer, nullable: true }
                admin_notes: { type: string }
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "200": { description: "OK — invite_sent true when approving pending → prospect" }
        "400": { description: "validation.invalidField | validation.emailRequired (approve without email)" }
        "409": { description: "errors.duplicate (email already used by another client)" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/clients/{id}/portal-invite:
    post:
      summary: "Email the client a 5-day magic-link portal invite (/client/invite/:token)"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `people.write`. Issues client_portal_invites row and emails tplPortalNotice CTA."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, invite_sent }" }
        "400": { description: "validation.emailRequired when client has no email" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
        "409": { description: "errors.authInactive" }
  /api/admin/projects:
    get:
      summary: "List projects (query: milestone, q, affiliate_id, contractor_id, assigned_admin_id, loan_status, limit, offset)"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `projects.read`. Same server filters as the board. Finance fields stripped without finance.read."
      parameters:
        - { name: milestone, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: affiliate_id, in: query, required: false, schema: { type: integer } }
        - { name: contractor_id, in: query, required: false, schema: { type: integer } }
        - { name: assigned_admin_id, in: query, required: false, schema: { type: integer } }
        - { name: loan_status, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: "OK { projects, total, limit, offset }" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    post:
      summary: "Create a project for an existing client"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `projects.write`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: integer }
                adu_plan_id: { type: integer, nullable: true }
                affiliate_id: { type: integer, nullable: true }
                property_address: { type: string }
      responses:
        "201": { description: "Created (public id GW-XXXXXXXX)" }
        "400": { description: "errors.invalidReference" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/projects/board:
    get:
      summary: "Kanban board — per-milestone columns with server filters and pagination"
      tags: [portal-admin]
      description: |
        Requires gw_admin_sid and permission `projects.read`.
        Without `milestone`, returns every milestone column (offset 0).
        With `milestone`, returns one column page (`offset` / `limit`) for load-more.
        Filters apply server-side to every column. Finance fields stripped without finance.read.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: milestone, in: query, required: false, schema: { type: string, enum: [lead, financing, contracted, in_build, closed, cancelled] } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: affiliate_id, in: query, required: false, schema: { type: integer } }
        - { name: contractor_id, in: query, required: false, schema: { type: integer } }
        - { name: assigned_admin_id, in: query, required: false, schema: { type: integer } }
        - { name: loan_status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Full board `{ columns }` or single-column page `{ milestone, items, total, has_more }`" }
        "400": { description: "validation.invalidField (bad id filters)" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/projects/{publicId}:
    get:
      summary: "Project detail: project, contracts, draws, photos, milestone events, commission(s)"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `projects.read`. Finance roles get `commission` (primary closer/direct) plus `commissions[]` for split closer+parent rows. Project may include frozen `commission_rate_*_cents_per_sqft` after loan finalize."
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OK { project, photos, draws, contracts, events, commission, commissions }" }
        "404": { description: "errors.notFound" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
    patch:
      summary: "Update project. Ops fields need projects.write; money fields (*_cents) need finance.write"
      tags: [portal-admin]
      description: "Requires gw_admin_sid and permission `projects.write`."
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Any subset. Side effects: loan finalized creates a pending commission (payout delay from settings); leaving finalized voids unpaid commissions; in_build requires an active contractor; affiliate cannot change after finalize (errors.projectLocked). Milestone changes follow a state machine: forward one step (financing may be skipped), back one step, any active stage -> cancelled, closed -> in_build only, cancelled -> lead only; anything else is 409 errors.invalidTransition. The check runs under a row lock, so concurrent moves cannot both win."
              properties:
                contractor_id: { type: integer, nullable: true }
                affiliate_id: { type: integer, nullable: true }
                adu_plan_id: { type: integer, nullable: true }
                milestone: { type: string, enum: [lead, financing, contracted, in_build, closed, cancelled] }
                property_address: { type: string }
                sq_ft: { type: integer }
                loan_status: { type: string, enum: [not_started, in_process, underwriting, approved, finalized, denied, withdrawn] }
                loan_lender_type: { type: string, enum: [anchor, external, unknown] }
                loan_lender_name: { type: string }
                anchor_external_id: { type: string }
                notes: { type: string }
                sale_price_cents: { type: integer }
                contractor_cost_cents: { type: integer }
                agent_commission_cents: { type: integer }
                commission_override_cents: { type: integer, nullable: true }
      responses:
        "200": { description: "OK" }
        "409": { description: "errors.invalidTransition / errors.contractorInactive / errors.projectLocked / errors.commissionPaidLocked" }
        "400": { description: "errors.contractorRequired / errors.drawExceedsBudget / errors.invalidReference / validation.invalidField" }
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
  /api/admin/projects/{publicId}/anchor/sync:
    post:
      summary: Sync loan status from Anchor API (requires ANCHOR_API_KEY + ANCHOR_API_BASE)
      tags: [portal-admin]
      description: |
        Requires gw_admin_sid and `projects.write`. Project must have
        loan_lender_type=anchor and anchor_external_id set. Updates loan_status,
        anchor_last_synced_at, and accrues/voids commissions when finalize flips.
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Synced project detail }
        "400": { description: Missing Anchor id or wrong lender type }
        "404": { description: Project or Anchor loan not found }
        "503": { description: Anchor not configured }
  /api/cron/anchor-sync:
    post:
      summary: Cron batch sync for all Anchor-linked projects
      tags: [cron]
      description: Authorization Bearer CRON_SECRET. Caps at 200 projects per run.
      responses:
        "200": { description: Batch result }
        "401": { description: Unauthorized }
        "503": { description: Anchor not configured }
  /api/cron/contractor-applications:
    get:
      summary: "Daily prequalification sweep (Vercel Cron)"
      tags: [cron]
      description: "Authorization Bearer CRON_SECRET. Draft / needs-info reminders (new: day 3/7/14; existing contractors: 7/14/25), missing-document nudges after submit (day 7/13), soft-deadline flags to staff (`contractor_compliance_alert`, access unchanged), and expiring license/bond/COI reminders at 30/7/0 days on approved files. Each step caps its batch."
      responses:
        "200": { description: "{ ok, reminders, missing_docs, overdue, expiring }" }
        "401": { description: Unauthorized }
    post:
      summary: "Manual run of the prequalification sweep"
      tags: [cron]
      description: "Same as GET (Authorization Bearer CRON_SECRET)."
      responses:
        "200": { description: "{ ok, reminders, missing_docs, overdue, expiring }" }
        "401": { description: Unauthorized }
  /api/public/contractor-application/resend:
    post:
      summary: "Email a fresh prequalification link"
      tags: [portal-public]
      description: "Always answers { ok: true } (no account enumeration). Sends only when a non-suspended contractor with a non-denied application exists for the email."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { description: "validation.emailInvalid" }
        "429": { description: "Rate limited" }
  /api/public/contractor-application/{token}:
    get:
      summary: "Load the prequalification application for a magic link"
      tags: [portal-public]
      description: "Token = 64 hex chars from the emailed `/contractor/apply/{token}` link (stored hashed, 30-day TTL; several may be live). Opening it as an `invited` contractor accepts the invite (→ pending). `?lang=en|es` picks the certification text. Returns ContractorApplicationPublicView (shared/contractorApplication.ts)."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200": { description: "{ ok, application, contractor, documents, requirements, templates }" }
        "404": { description: "errors.applicationLinkInvalid" }
    put:
      summary: "Autosave answers (draft / needs_info only)"
      tags: [portal-public]
      description: "Body { data, current_step }. Data is whitelisted onto the stored draft (unknown keys dropped, enums/dates/lengths enforced)."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: object }
                current_step: { type: integer, minimum: 0 }
      responses:
        "200": { description: "{ ok, requirements }" }
        "404": { description: "errors.applicationLinkInvalid" }
        "409": { description: "errors.applicationLocked" }
  /api/public/contractor-application/{token}/upload-token:
    post:
      summary: "Mint a pathname-scoped client token for a direct private Blob upload"
      tags: [portal-public]
      description: "Body { doc_type, content_type (pdf/jpeg/png/webp), size_bytes ≤ 25MB }. Requires BLOB_PRIVATE_READ_WRITE_TOKEN (private store). After approval only expiring-document renewals are accepted."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, client_token, pathname }" }
        "400": { description: "validation.documentFile | validation.documentTooLarge | validation.invalidField" }
        "409": { description: "errors.applicationLocked | errors.documentLimit" }
        "503": { description: "errors.storageNotConfigured" }
  /api/public/contractor-application/{token}/documents:
    post:
      summary: "Register an uploaded document"
      tags: [portal-public]
      description: "Body { doc_type, pathname, file_name, expires_on? }. Pathname must belong to this application + doc type; size and magic bytes (PDF / image) are verified server-side (bad files are deleted). Single-file types replace the previous upload. Expiring types require expires_on (YYYY-MM-DD)."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "{ ok, document }" }
        "400": { description: "validation.documentFile | validation.expirationRequired" }
        "409": { description: "errors.applicationLocked | errors.duplicate" }
  /api/public/contractor-application/{token}/documents/{docId}:
    patch:
      summary: "Update a document's expiration date"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "400": { description: "validation.expirationRequired" }
        "409": { description: "errors.applicationLocked" }
    delete:
      summary: "Remove an uploaded document (not once accepted)"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "409": { description: "errors.applicationLocked" }
  /api/public/contractor-application/{token}/documents/{docId}/file:
    get:
      summary: "302 to a 5-minute presigned URL for the contractor's own upload"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        "302": { description: "Redirect to presigned private Blob URL" }
        "404": { description: "errors.notFound" }
  /api/public/contractor-application/{token}/submit:
    post:
      summary: "E-sign and submit the application"
      tags: [portal-public]
      description: "Body { signer_name, signer_title, signer_email, signer_phone, signature_image (PNG data URL), certify: true, lang }. Requires every required answer, every applicable core document and a saved membership card (unless waived / billing not configured). Records IP, user agent, timestamp, certification version + SHA-256 of the certified text. Emails the contractor and notifies staff (`contractor_application_submitted`)."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, status: submitted, missing_docs[] (approval-level docs still owed) }" }
        "400": { description: "validation.applicationIncomplete { missing_fields } | validation.applicationDocsMissing { missing_docs } | validation.signatureRequired | validation.certifyRequired" }
        "409": { description: "errors.applicationLocked | errors.cardRequiredToSubmit" }
  /api/contractor/application:
    get:
      summary: "Signed-in contractor's prequalification summary (portal banner)"
      tags: [portal-contractor]
      description: "Requires gw_contractor_sid."
      responses:
        "200": { description: "{ ok, application: { application_number, status, due_at, submitted_at } | null }" }
        "401": { description: "Not signed in" }
  /api/contractor/application/link:
    post:
      summary: "Mint a fresh magic link for the signed-in contractor"
      tags: [portal-contractor]
      description: "Creates the application if missing. Returns the SPA path /contractor/apply/{token}."
      responses:
        "200": { description: "{ ok, path }" }
        "401": { description: "Not signed in" }
        "409": { description: "errors.applicationLocked (denied)" }
  /api/admin/cpq-templates:
    get:
      summary: "Blank forms contractors sign (MCA, background check authorization)"
      tags: [portal-admin]
      description: "Requires `people.read`."
      responses:
        "200": { description: "{ ok, templates }" }
  /api/admin/cpq-templates/{kind}:
    post:
      summary: "Upload a blank template PDF (raw application/pdf body, ≤4MB)"
      tags: [portal-admin]
      description: "Requires `approvals`. kind = master_contractor_agreement | background_check_authorization. Once published, the signed copy becomes required to submit."
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [master_contractor_agreement, background_check_authorization] } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "200": { description: "{ ok, templates }" }
        "400": { description: "validation.pdfFile" }
    delete:
      summary: "Unpublish a template"
      tags: [portal-admin]
      description: "Requires `approvals`."
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, templates }" }
  /api/admin/contractors/application/send-bulk:
    post:
      summary: "Send the prequalification to every active contractor without one"
      tags: [portal-admin]
      description: "Requires `approvals`. Without { confirm: true } returns a dry run { count, sample }. Sends up to 200 per call with a 30-day soft deadline (portal access unaffected)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean }
      responses:
        "200": { description: "{ ok, dry_run, count, sample? , sent?, failed?, remaining? }" }
  /api/admin/contractors/{id}/application:
    get:
      summary: "Prequalification review payload"
      tags: [portal-admin]
      description: "Requires `people.read`. Without `finance.read` the financial section is emptied (`financial_redacted`) and sensitive documents (W-9, financials, bank / surety letters, background authorization) are redacted."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "AdminContractorApplicationView (application null when never sent)" }
        "404": { description: "errors.notFound" }
  /api/admin/contractors/{id}/application/documents/{docId}/file:
    get:
      summary: "302 to a presigned URL for a document"
      tags: [portal-admin]
      description: "Requires `people.read`; sensitive document types also need `finance.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        "302": { description: "Redirect" }
        "403": { description: "errors.forbidden" }
        "404": { description: "errors.notFound" }
  /api/admin/contractors/{id}/application/pdf:
    get:
      summary: "Application PDF (paper-form layout, EN/ES via ?lang=)"
      tags: [portal-admin]
      description: "Requires `people.read`. Financials redacted without `finance.read`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        "200": { description: "application/pdf" }
        "404": { description: "errors.applicationNotFound" }
  /api/admin/contractors/{id}/application/send:
    post:
      summary: "Create (if needed) and email the application link"
      tags: [portal-admin]
      description: "Requires `approvals`. Active contractors get a 30-day soft deadline. Copy adapts to status (new / reminder / info request / missing documents)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, application_number, status }" }
        "409": { description: "errors.applicationLocked (denied) | errors.contractorSuspended" }
  /api/admin/contractors/{id}/application/review:
    patch:
      summary: "Office-use fields"
      tags: [portal-admin]
      description: "Requires `approvals`. Body subset of { license_verified, insurance_verified (true|false|null), decision_notes }. Moves submitted → in_review."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "409": { description: "errors.applicationLocked" }
  /api/admin/contractors/{id}/application/documents/{docId}:
    patch:
      summary: "Accept / reject a document"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { status: accepted|rejected|uploaded, review_note } — reject needs a note (shown to the contractor)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "400": { description: "validation.rejectNoteRequired" }
  /api/admin/contractors/{id}/application/request-info:
    post:
      summary: "Send the application back for more info"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { note (5+ chars), doc_types[] }. Status → needs_info; contractor emailed a fresh link."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "400": { description: "validation.infoRequestNoteRequired" }
        "409": { description: "errors.applicationLocked" }
  /api/admin/contractors/{id}/application/decision:
    post:
      summary: "Approve or deny"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { decision: approved|denied, notes, message, allow_missing }. Approve needs license + insurance verified and every applicable document, unless allow_missing with notes (5+). Approving activates pending / invited contractors (login email); denying a pending one sets it inactive."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, status, contractor_status }" }
        "409": { description: "errors.applicationVerifyFirst | errors.applicationDocsMissing { missing_docs } | errors.applicationLocked" }
  /api/admin/contractors/{id}/application/reopen:
    post:
      summary: "Reopen for edits + re-signature"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { note }. Clears the signature; a denied + inactive contractor returns to pending."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "OK" }
        "409": { description: "errors.applicationLocked (already draft)" }
  /api/admin/clients/{id}/move-to-affiliate:
    post:
      summary: "Move a client to affiliate (signed up as a homeowner but is a realtor / partner)"
      tags: [portal-admin]
      description: "Perm approvals. Body { dry_run: true } → { plan, inviter }; { confirm: true, confirm_phone_link? } → undoes the client (same blockers as Move back to Leads) and converts that lead to a pending affiliate under the same inviter (Sponsor), with the affiliate welcome. If the conversion step fails, the person is already back in Leads (lead_id returned)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Dry run: { ok, dry_run, plan, inviter }" }
        "201": { description: "{ ok, lead_id, affiliate_id, inviter }" }
        "409": { description: "errors.clientRevertBlocked (plan) | phone link confirm needed" }
  /api/admin/duplicates:
    get:
      summary: "Duplicate review queue (one role per person; email OR phone)"
      tags: [portal-admin]
      description: "Requires `people.read`. Groups leads / clients / affiliates / contractors sharing an email or last-10-digit phone into clusters (kind same_role | cross_role | lead_of_person | repeat_leads) with linked-row counts and delete blockers. Clusters marked \"not duplicates\" are hidden until a new member appears."
      responses:
        "200": { description: "{ ok, clusters[], total }" }
  /api/admin/clients/{id}/revert-preview:
    get:
      summary: "Preview \"Move back to Leads\" for a client (undo a conversion)"
      tags: [portal-admin]
      description: "Requires `approvals` (super_admin, admin). Returns the plan: origin (lead | contact | unknown | new_lead), the lead(s) that would return to Active, the CRM contact / Conversations unknown contact(s), counts (conversations moved, projects removed, notes copied, unused invites revoked) and blockers (portal_used, projects_in_progress, contractor_assigned, commissions, missing_contact_info). Changes nothing."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, dry_run: true, plan, result: null }" }
        "404": { description: "errors.notFound" }
  /api/admin/clients/{id}/revert-to-lead:
    post:
      summary: "Move a client back to Leads (undo a conversion)"
      tags: [portal-admin]
      description: "Requires `approvals`. Body { lead_status?: new|contacted|qualified|closed (default: keep; new leads default to contacted), reason?, dry_run? }. In one transaction: threads move off the client (to the CRM contact, or each line's open unknown contact), lead(s) are un-linked (or a new lead is created for direct clients), client notes + deal-status history are appended to the lead / contact notes (or an internal note on the thread), empty projects and unused portal invites are removed, the client is deleted, and a full snapshot is written to people_dedupe_log (action=revert). Staff get a \"Conversion undone\" notice (lead_converted prefs); the homeowner and affiliate are not messaged."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, dry_run, plan, result: { lead_id, contact_id, unknown_contact_id } | null }" }
        "400": { description: "validation.invalidField (lead_status)" }
        "404": { description: "errors.notFound" }
        "409": { description: "errors.clientRevertBlocked { blockers[], plan }" }
  /api/affiliate/onboarding/billing:
    get:
      summary: "Affiliate billing status (card on file, free period, next charge)"
      tags: [portal-affiliate]
      description: "Affiliate session or the secure welcome link (header `x-onboarding-token`). Returns { billing: { configured, status: none|trialing|active|past_due|canceled|incomplete, price_cents, trial_days, trial_ends_at, current_period_end, card: { brand, last4, exp } | null } }."
      responses:
        "200": { description: "{ ok, billing }" }
        "401": { description: "errors.unauthorized" }
  /api/affiliate/onboarding/billing/setup:
    post:
      summary: "Start saving a card (one-time setup secret for the card form)"
      tags: [portal-affiliate]
      description: "Affiliate session or welcome link. Requires a signed agreement. Creates the billing customer once and a card setup intent."
      responses:
        "200": { description: "{ ok, client_secret }" }
        "409": { description: "errors.agreementRequiredFirst" }
        "503": { description: "errors.billingNotConfigured" }
  /api/affiliate/onboarding/billing/activate:
    post:
      summary: "Confirm the saved card and start (or update) the monthly plan"
      tags: [portal-affiliate]
      description: "Body { setup_intent_id }. The setup intent must belong to this affiliate and be succeeded. Sets the card as default. The plan (and its free period, setting affiliate_trial_days, default 90) starts only once the affiliate is approved (status active) — a pending affiliate's card is saved and the plan starts on approval. Existing plans just switch card."
      responses:
        "200": { description: "{ ok, billing }" }
        "400": { description: "validation.invalidField" }
        "409": { description: "errors.cardNotConfirmed | errors.agreementRequiredFirst" }
  /api/affiliate/billing/cancel:
    post:
      summary: "Cancel (or resume) the platform subscription at the end of the paid month"
      tags: [portal-affiliate]
      description: "Affiliate session only. Body { resume?: true }."
      responses:
        "200": { description: "{ ok, billing }" }
        "404": { description: "errors.notFound" }
  /api/contractor/billing:
    get:
      summary: "Contractor platform membership + whether the portal is locked"
      tags: [portal-contractor]
      description: "Contractor session. { ok, billing, locked }. Approved (active) contractors need a membership in free period or paid ($99.90/mo default, setting contractor_default_price_cents; 30 days free from approval, contractor_trial_days). While locked, other /api/contractor/* routes return 402 errors.billingRequired."
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "401": { description: "errors.unauthorized" }
  /api/contractor/billing/setup:
    post:
      summary: "One-time setup secret for the secure card form"
      tags: [portal-contractor]
      responses:
        "200": { description: "{ ok, client_secret }" }
        "503": { description: "errors.billingNotConfigured" }
  /api/contractor/billing/activate:
    post:
      summary: "Confirm the saved card; start the membership if approved (or switch card)"
      tags: [portal-contractor]
      description: "Body { setup_intent_id }. The free period is granted once; a returning member is billed right away. When the plan is past due, the open invoice is charged to the new card immediately (unlocks the portal on success). The replaced card is detached from the processor (one card on file)."
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "400": { description: "validation.invalidField" }
        "402": { description: "errors.cardChargeFailed (new card declined on the open invoice)" }
        "409": { description: "errors.cardNotConfirmed" }
  /api/contractor/billing/cancel:
    post:
      summary: "Cancel (or resume) the membership at the end of the paid month"
      tags: [portal-contractor]
      description: "Body { resume?: true }."
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "404": { description: "errors.notFound" }
  /api/public/contractor-application/{token}/billing:
    get:
      summary: "Membership card status during the prequalification application"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, billing }" }
        "404": { description: "errors.applicationLinkInvalid" }
  /api/public/contractor-application/{token}/billing/setup:
    post:
      summary: "Setup secret for the membership card (application link)"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, client_secret }" }
        "409": { description: "errors.applicationLocked" }
  /api/public/contractor-application/{token}/billing/activate:
    post:
      summary: "Save the membership card (nothing is charged; the free period starts on approval)"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      description: "Body { setup_intent_id }. Submitting the application requires a saved card (409 errors.cardRequiredToSubmit) unless the fee is waived or billing isn't configured. A denied application releases the card."
      responses:
        "200": { description: "{ ok, billing }" }
        "409": { description: "errors.cardNotConfirmed | errors.applicationLocked" }
  /api/admin/contractors/{id}/billing:
    get:
      summary: "A contractor's membership (admin)"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing, locked }" }
    patch:
      summary: "Set a contractor's monthly price (null = default, 0 = waived)"
      tags: [portal-admin]
      description: "Perm finance.write. Body { price_cents: integer | null }. A live plan moves to the new price at the next cycle (no proration); 0 cancels it. Without a plan, starts one if approved with a card on file."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "400": { description: "validation.invalidField" }
        "404": { description: "errors.notFound" }
  /api/affiliate/billing/status:
    get:
      summary: "Affiliate platform plan + whether the portal is paused"
      tags: [portal-affiliate]
      description: "Affiliate session. { ok, billing, locked }. An approved affiliate whose payment failed (past_due / incomplete) is paused: other /api/affiliate/* routes return 402 errors.billingRequired except billing, onboarding (agreement / W-9 / card), FAQ, assistant and /me. Commission payouts are held (payout_ready). The public referral link keeps recording."
      responses:
        "200": { description: "{ ok, billing, locked }" }
        "401": { description: "errors.unauthorized" }
  /api/cron/billing-card-expiry:
    get:
      summary: "Daily card-expiry + free-period-ending reminders (Vercel Cron)"
      tags: [cron]
      description: "Bearer CRON_SECRET. Email + SMS to members (affiliates, contractors) whose card on file expires within 30 days and again within 7 days of the end of its expiry month; once per card per threshold (billing_expiry_notice). Staff see a 'Card expiring' badge. Also sends the free-period-ending notice (California auto-renewal) once per member about 7 days before the first charge (billing_trial_reminder_sent_at); response adds trial_reminders."
      responses:
        "200": { description: "{ ok, sent }" }
        "401": { description: "errors.unauthorized" }
    post:
      summary: "Daily card-expiry reminders (manual trigger)"
      tags: [cron]
      description: "Same as GET (Bearer CRON_SECRET)."
      responses:
        "200": { description: "{ ok, sent }" }
        "401": { description: "errors.unauthorized" }
  /api/admin/affiliates/{id}/send-link:
    post:
      summary: "Send an approved affiliate their referral link again (email + text)"
      tags: [portal-admin]
      description: "Perm approvals. Same message as on approval: congratulations + EN and ES links (/r/{slug} and ?lang=es), in their language. Records affiliates.link_sent_at. The approval paths (admin PATCH pending→active, lead convert to active, MCP approve_affiliate) send it automatically."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, email, sms }" }
        "404": { description: "errors.notFound" }
        "409": { description: "errors.affiliateNotApproved" }
  /api/admin/affiliate-links/unsent:
    get:
      summary: "How many approved affiliates never received their referral link"
      tags: [portal-admin]
      description: "Perm approvals. Active affiliates with link_sent_at IS NULL."
      responses:
        "200": { description: "{ ok, count }" }
  /api/admin/affiliate-links/send-all:
    post:
      summary: "Send the referral-link message to every approved affiliate who never got it"
      tags: [portal-admin]
      description: "Perm approvals. Body { confirm: true }. Staff-triggered only."
      responses:
        "200": { description: "{ ok, sent, failed }" }
        "400": { description: "validation.confirmRequired" }
  /api/admin/people/{kind}/{id}/automatic-messages:
    get:
      summary: "Automatic emails / texts the system sent this person (record pages)"
      tags: [portal-admin]
      description: "Perm people.read. kind = client | lead | affiliate | contractor | contact. Every system email / text to a CRM person is logged here (and in their Conversations thread with metadata automatic=true). Staff-typed and campaign sends are not (sendEmail / sendSms manual: true)."
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, messages[{ id, channel, to, subject, preview, test_mode, sent_at }] }" }
  /api/admin/last-touch:
    get:
      summary: "Latest text and call with one phone number (record pages)"
      tags: [portal-admin]
      description: "Perm people.read. Same shape as the Leads list last_sms / last_call (direction, when, preview or duration, thread link). The clients, affiliates, contractors and contacts list endpoints include last_sms / last_call per row."
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, last_sms, last_call }" }
  /api/public/lead-role/{token}/{role}:
    get:
      summary: "Welcome-email button: record who the lead is (A homeowner / B partner / C contractor) and open the matching application"
      tags: [public]
      description: "Event RSVPs and /get-credit-report signups get a welcome text + email asking A / B / C. Text replies are handled by the Twilio inbound webhook (leadRoleFromReply). First answer wins; staff get a lead_submitted alert. Redirects to /start, /affiliate/signup or /contractor/signup with ?t=token."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [homeowner, partner, contractor] } }
      responses:
        "302": { description: "Redirect to the application form" }
  /api/public/lead-prefill/{token}:
    get:
      summary: "Known details for application forms opened from the A/B/C links"
      tags: [public]
      description: "Token from the welcome message (valid 60 days)."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, prefill: { first_name, last_name, email, phone, preferred_language, property_address } }" }
        "404": { description: "errors.notFound" }
  /api/admin/notify-routing:
    get:
      summary: "Who gets each notification area (Settings, super_admin)"
      tags: [portal-admin]
      description: "Perm staff. Areas: leads (leads, credit report, contact, RSVP, conversions), clients, contractors, affiliates, projects (milestones, draws, commissions, contracts), system. Not configured = super admins only. include_owner: the record's assigned staff member also gets it. Inbound SMS / email go to the line or mailbox owner and are not routed. Each person's prefs still pick email / bell / SMS."
      responses:
        "200": { description: "{ ok, areas[{ area, events[], configured, admin_ids[], include_owner }], staff[] }" }
    put:
      summary: "Set who gets each area"
      tags: [portal-admin]
      description: "Perm staff. Body { areas: [{ area, admin_ids[], include_owner } | { area, reset: true }] }. reset = back to super admins only."
      responses:
        "200": { description: "Same as GET" }
        "400": { description: "validation.notifyRoutingEmpty" }
  /api/admin/mail/status:
    get:
      summary: "Mail section bootstrap: mailboxes I can open, unread counts, setup state"
      tags: [portal-admin]
      description: "Any staff. Own personal mailbox + shared mailboxes granted via mailbox_access; super_admin/admin see all. configured=false until OFFICE365_TENANT_ID / CLIENT_ID / CLIENT_SECRET are set."
      responses:
        "200": { description: "{ ok, configured, can_manage, allowed_domains, mailboxes[] }" }
  /api/admin/mail/mailboxes:
    get:
      summary: "Connected Microsoft 365 mailboxes with access lists (admin)"
      tags: [portal-admin]
      description: "Perm mail.manage (super_admin, admin)."
      responses:
        "200": { description: "{ ok, mailboxes[] }" }
    post:
      summary: "Connect a Microsoft 365 mailbox"
      tags: [portal-admin]
      description: "Perm mail.manage. Body { email, kind personal|shared, owner_admin_id (personal), display_name?, mail_sync_enabled?, calendar_sync_enabled?, signature_html?, access?: [{admin_id, can_send}] }. Only MAIL_ALLOWED_DOMAINS (default groundworkcapitalgroup.com; "*" = any mailbox in the tenant). Probes Graph (inbox + calendar) before saving, then runs the first sync."
      responses:
        "201": { description: "{ ok, id, sync, mailboxes[] }" }
        "400": { description: "validation.mailboxDomain | validation.mailboxOwner | errors.mailboxNotFound | errors.mailboxAccessDenied" }
        "409": { description: "errors.mailboxExists" }
        "503": { description: "errors.mailNotConfigured" }
  /api/admin/mail/mailboxes/{id}:
    patch:
      summary: "Edit a mailbox (owner, type, sync toggles, signature, access, pause/resume)"
      tags: [portal-admin]
      description: "Perm mail.manage. Any subset of the POST body plus status active|paused. access replaces the list when sent."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, mailboxes[] }" }
    delete:
      summary: "Disconnect a mailbox"
      tags: [portal-admin]
      description: "Perm mail.manage, or the owner of a mailbox they connected with Microsoft sign-in. Body { confirm: true }. Removes CRM copies (threads, messages, calendar links) and Outlook-only appointments; nothing is deleted in Outlook."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, mailboxes[] }" }
  /api/admin/mail/mailboxes/{id}/sync:
    post:
      summary: "Sync one mailbox now (mail + calendar)"
      tags: [portal-admin]
      description: "Staff with access to the mailbox. Serialized per mailbox (DB lock). Partial delta items (only changed fields) are re-fetched in full, and up to 25 messages stored blank by older syncs are repaired per run (`repaired`)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, result: { inbox, sent, repaired, calendar, errors[] } }" }
  /api/admin/mail/threads:
    get:
      summary: "Email threads across my mailboxes"
      tags: [portal-admin]
      parameters:
        - { name: mailbox_id, in: query, schema: { type: integer } }
        - { name: folder, in: query, schema: { type: string, enum: [inbox, sent, all, archived] } }
        - { name: unread, in: query, schema: { type: string, enum: ["1"] } }
        - { name: linked, in: query, description: "Only threads matched to a CRM person", schema: { type: string, enum: ["1"] } }
        - { name: q, in: query, description: "Subject, text, sender, participants, matched name", schema: { type: string } }
        - { name: match_kind, in: query, schema: { type: string, enum: [client, lead, affiliate, contractor, contact] } }
        - { name: match_id, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, threads[], next_cursor }" }
  /api/admin/mail/threads/{id}:
    get:
      summary: "Thread with messages (sanitized HTML); marks it read here and in Outlook"
      tags: [portal-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: peek, in: query, description: "1 = don't mark read", schema: { type: string } }
      responses:
        "200": { description: "{ ok, can_send, thread, messages[] }" }
    delete:
      summary: "Delete a conversation (moves every message to Outlook Deleted Items, then removes the CRM copy)"
      tags: [portal-admin]
      description: "Needs can_send on the mailbox. Body { confirm: true }. If Outlook refuses any message, nothing is removed here (502 errors.mailDeleteFailed)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok }" }
    patch:
      summary: "Archive / unarchive (moves to Outlook's Archive folder / back to Inbox) or mark unread (also in Outlook)"
      tags: [portal-admin]
      description: "Body { archived?: boolean, unread?: boolean }."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok, thread }" }
  /api/admin/mail/send:
    post:
      summary: "Send or reply from a connected mailbox (Graph sendMail / reply / replyAll)"
      tags: [portal-admin]
      description: "Staff with can_send on the mailbox. Body { mailbox_id, to[], cc[], subject, html, reply_to_message_id?, reply_all?, forward_message_id? (needs to; original + attachments included), draft_id? (removed after sending), attachments?: [{name, content_type, base64}] } (3 MB total). Replies and forwards keep the earlier conversation quoted (Graph comment). Mailbox signature appended. NOTIFY_SANDBOX / Vitest: never sent, stored in the thread with a sandbox id (dry_run true)."
      responses:
        "201": { description: "{ ok, dry_run, thread_id }" }
        "413": { description: "validation.mailAttachmentsTooLarge" }
  /api/admin/mail/drafts:
    get:
      summary: "My drafts (mailboxes I can open)"
      tags: [portal-admin]
      responses:
        "200": { description: "{ ok, drafts[{ id, mailbox_id, mode new|reply|replyAll|forward, source_message_id, source_thread_id, to, cc, subject, html, attachments, updated_at }] }" }
    put:
      summary: "Save a draft (autosave); mirrored to the mailbox's Outlook Drafts"
      tags: [portal-admin]
      description: "Needs can_send on the mailbox. Body { id?, mailbox_id, mode, source_message_id? (reply/forward), to[], cc[], subject, html, attachments[] (3 MB) }. Replies/forwards are re-created in Outlook (createReply / createReplyAll / createForward) so the quoted conversation stays; attachments stay in the CRM draft. Sandbox: CRM only. Drafts untouched for 60 days are removed by the mail-sync cron."
      responses:
        "200": { description: "{ ok, draft }" }
        "413": { description: "validation.mailAttachmentsTooLarge" }
