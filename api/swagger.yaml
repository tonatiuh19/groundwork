        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Image bytes" }
  /api/admin/mail/oauth/start:
    get:
      summary: "Connect with Microsoft: start sign-in for the current staff member's own mailbox"
      tags: [portal-admin]
      description: "Any staff. Redirects to login.microsoftonline.com/common (work or personal Microsoft accounts) with delegated scopes Mail.ReadWrite, Mail.Send, Calendars.ReadWrite, offline_access. State is HMAC-signed, 15 min, bound to the staff session. ?json=1 returns { url } instead. 503 errors.mailNotConfigured | errors.mailTokenKeyMissing."
      responses:
        "302": { description: "Redirect to Microsoft" }
  /api/mail/oauth/callback:
    get:
      summary: "Microsoft sign-in callback: saves the mailbox (personal, auth_mode delegated) and runs the first sync"
      tags: [portal-admin]
      description: "Must be the same staff session that started. Tokens are stored AES-256-GCM sealed (MAIL_TOKEN_KEY) and refreshed automatically; when Microsoft revokes them the mailbox shows Reconnect. No domain restriction (MAIL_ALLOWED_DOMAINS applies only to admin-connected mailboxes)."
      responses:
        "302": { description: "/admin/mail?connected={id} or ?connect_error=errors.mailConnectExpired | mailConnectDenied | mailConnectFailed | mailboxIsShared | mailboxTakenByOther" }
  /api/admin/mail/last-email:
    get:
      summary: "Latest email with one address (record pages \"Last email\")"
      tags: [portal-admin]
      description: "Perm people.read."
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, last_email: { at, direction, preview, thread_id } | null }" }
  /api/cron/mail-sync:
    get:
      summary: "Vercel Cron, hourly at :05: sync every active mailbox (mail delta + calendar both ways)"
      tags: [cron]
      description: "Bearer CRON_SECRET. Skips @example.com / @example.test test mailboxes. Mail: Inbox + Sent Items via Graph delta (first run 90 days; immutable ids). Email moved out of the Inbox in Outlook stays as Archived (trash = removed). New email from CRM people alerts the owner (shared: people with access) by bell + text per their inbound_email prefs, once, never for the first backfill. Calendar: 30 days back to 90 ahead; Outlook events become appointments (source outlook), CRM appointments are written onto the owner's and tagged staff's calendars."
      responses:
        "200": { description: "{ ok, mailboxes, errors }" }
        "401": { description: "errors.unauthorized" }
    post:
      summary: "Same as GET (manual trigger)"
      tags: [cron]
      description: "Bearer CRON_SECRET."
      responses:
        "200": { description: "{ ok, mailboxes, errors }" }
        "401": { description: "errors.unauthorized" }
  /api/cron/reminder-flows:
    get:
      summary: "Vercel Cron, hourly at :15: run due reminder-flow steps (exits after one tiny query when no automation is on) and end runs whose goal is met"
      tags: [cron]
      description: "Bearer CRON_SECRET. Texts only in each flow's quiet-hours window (Pacific), only with SMS consent and never to opted-out numbers."
      responses:
        "200": { description: "{ ok, processed, goals }" }
        "401": { description: "errors.unauthorized" }
    post:
      summary: "Same as GET (manual trigger)"
      tags: [cron]
      description: "Bearer CRON_SECRET."
      responses:
        "200": { description: "{ ok, processed, goals }" }
        "401": { description: "errors.unauthorized" }
