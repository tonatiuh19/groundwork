  /api/admin/leads/{id}/convert:
    post:
      summary: "Convert a lead to client/homeowner, affiliate, or contractor"
      tags: [portal-admin]
      description: |
        Requires gw_admin_sid. Target `client` needs `projects.write` (creates client + project + invite).
        Targets `affiliate` / `contractor` need `approvals`. Default target is `client` for backward compatibility.
        Phone match with a different email returns 409 `errors.phoneLinkConfirmRequired` + `phone_match`;
        retry with `confirm_phone_link: true` to link that person.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [client, affiliate, contractor]
                  default: client
                adu_plan_id: { type: integer, nullable: true }
                status:
                  type: string
                  enum: [pending, active]
                  description: Affiliate/contractor confirm dialog (affiliate defaults active; contractor defaults pending)
                confirm_phone_link: { type: boolean }
      responses:
        "201":
          description: Converted
          content:
            application/json:
              schema:
                type: object
                required: [ok, target]
                properties:
                  ok: { type: boolean }
                  target: { type: string, enum: [client, affiliate, contractor] }
                  client_id: { type: integer }
                  project_public_id: { type: string }
                  affiliate_id: { type: integer }
                  contractor_id: { type: integer }
                  invite_sent: { type: boolean }
        "409":
          description: |
            errors.leadAlreadyConverted | errors.emailExists* | errors.phoneLinkConfirmRequired
            (phone link includes phone_match object)
        "401": { description: "Not signed in" }
        "403": { description: "Wrong portal, missing permission, or foreign Origin on a mutation (CSRF guard)" }
