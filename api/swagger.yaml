      responses:
        "302": { description: "Redirect to SPA /r or marketing landing with ?ref=" }
  /api/public/contractor-invite/{token}:
    get:
      summary: "Preview a contractor invitation"
      tags: [portal-public]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Invite preview (first_name, email, company)" }
        "404": { description: "errors.inviteInvalid" }
  /api/public/contractor-invite/accept:
    post:
      summary: "Accept a contractor invitation → starts the prequalification (contractor becomes pending; returns next=application + application_path). Already-approved applications activate (next=login)."
      tags: [portal-public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: "Accepted" }
        "404": { description: "errors.inviteInvalid" }
